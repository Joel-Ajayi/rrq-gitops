architecture: replication
auth:
  enabled: true
  existingSecret: redis-secret
  existingSecretPasswordKey: redis-password
sentinel:
  enabled: true
master:
  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
replica:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
commonConfiguration: |-
  appendonly no
  save ""
