# Dev-specific Network Policies
# These supplement the base policies (in ../../../base/workloads/services/network-policies.yaml)

# NOTE: kindnet (kind's default CNI) silently drops ALL egress (including to the API server)
# when ANY policy with policyTypes: [Egress] is present. 
# We explicitly override the default-deny-egress from the base layer with an allow-all egress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress-dev
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []
