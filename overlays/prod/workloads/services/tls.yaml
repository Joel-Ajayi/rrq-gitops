# Let's Encrypt issuer (cert-manager). Gateway API HTTP-01 Solver:
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: yotstack@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: rrq-gateway
                namespace: rrq

#  [1. ClusterIssuer]       ◄─────── Tells cert-manager where the ACME CA is
#          │
#          ▼
#  [2. Gateway]            ◄─────── Has cert-manager.io/cluster-issuer annotation + hostname
#          │
#          ▼ (Auto-creates via cert-manager gateway-shim)
#  [3. Certificate]        ◄─────── Solves ACME HTTP-01 challenge via gatewayHTTPRoute
#          │
#          ▼ (Auto-creates)
#  [4. Secret: rrq-edge-tls] ◄─────── Stores TLS cert & key
#          │
#          ▼ (Referenced by TLS listener)
#  [5. Gateway Listener]   ◄─────── Listens on 443 & attaches rrq-edge-tls Secret
#          │                           │
#          ├───────────────────────────┴──────────────────────────┐
#          ▼                                                      ▼
#  [6. HTTPRoute: rrq-public-route]                    [7. Envoy Gateway Policies]
#     Routes /v1 -> core-api:8080                         - SecurityPolicy (JWT validation)
#                                                         - ClientTrafficPolicy (Rate limits)
