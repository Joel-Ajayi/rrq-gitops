apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: rrq
spec:
  template:
    spec:
      containers:
        - name: core-api
          resources:
            requests: { cpu: "500m", memory: 128Mi }
            limits: { cpu: "2", memory: 256Mi }
---
