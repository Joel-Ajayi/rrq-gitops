# Breakpoint Testing Capacity Calibration Patch (Step 2 Sizing Gateway)
# Purpose: Isolates core-api to a single 1.0 CPU pod (maxReplicas: 1) and scales
# all background workers (ledger, fraud, webhook, outbox-relay) to 0.
# Workers scale via KEDA ScaledObjects, so the patch overrides ScaledObject
# counts (not HPA) to prevent autoscale-out during k6 breakpoint runs.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: core-api
          resources:
            requests: { cpu: "1", memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-api
spec:
  minReplicas: 1
  maxReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
spec:
  replicas: 0
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fraud-worker
spec:
  minReplicaCount: 0
  maxReplicaCount: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-worker
spec:
  replicas: 0
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ledger-worker
spec:
  minReplicaCount: 0
  maxReplicaCount: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
spec:
  replicas: 0
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: outbox-relay
spec:
  minReplicaCount: 0
  maxReplicaCount: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-worker
spec:
  replicas: 0
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: webhook-worker
spec:
  minReplicaCount: 0
  maxReplicaCount: 0
