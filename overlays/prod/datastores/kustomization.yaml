apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/platform/datastores
  - secrets.yaml
patches:
  - path: scale-up.yaml
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: rrq-seed-performance
        namespace: rrq
        annotations:
          argocd.argoproj.io/sync-wave: "1"
images:
  - name: rrq/seed-performance
    newName: ghcr.io/Joel-Ajayi/seed-performance
helmCharts:
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    version: 27.0.15
    releaseName: redis
    namespace: redis
    valuesFile: redis-values.yaml
