---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fraud-redis-node
  namespace: rrq
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: sentinel
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
