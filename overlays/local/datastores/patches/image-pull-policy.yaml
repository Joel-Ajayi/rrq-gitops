apiVersion: batch/v1
kind: Job
metadata:
  name: rrq-migrate
  namespace: rrq
spec:
  template:
    spec:
      containers:
        - name: migrate
          imagePullPolicy: IfNotPresent
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rrq-seed-performance
  namespace: rrq
spec:
  template:
    spec:
      containers:
        - name: seeder
          imagePullPolicy: IfNotPresent
