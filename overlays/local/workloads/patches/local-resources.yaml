apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: rrq
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: core-api
          resources:
            requests: { cpu: 1000m }
            limits: { cpu: 1712m }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: []
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - core-api
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-api
  namespace: rrq
spec:
  minReplicas: 2
  maxReplicas: 2
---
