# Local Prod: inject the Go auto-instrumentation agent into Go workloads.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: rrq
spec:
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-go: "observability/platform-autoinstrumentation"
