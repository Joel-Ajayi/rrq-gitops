# Dynamic JWT Verification Security Policy
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: rrq-security-policy
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rrq-protected-route
  jwt:
    providers:
      - name: merchant-auth
        issuer: rrq-core-api
        remoteJWKS:
          uri: http://core-api.rrq.svc.cluster.local:8080/.well-known/jwks.json
        claimToHeaders:
          - claim: sub
            header: X-Merchant-Id
          - claim: tier
            header: X-Merchant-Tier
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rrq-merchant-rate-limit
  namespace: rrq
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rrq-protected-route

  rateLimit:
    global:
      rules:
        - clientSelectors:
            - headers:
                - type: Distinct
                  name: X-Merchant-Id
          limit:
            requests: 100
            unit: Minute
