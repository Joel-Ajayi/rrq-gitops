---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "metrics.127.0.0.1.nip.io"
    - "metrics.rrq.yotstack.tech"
  rules:
    # Executive NOC Overview Shortcuts
    - matches:
        - path:
            type: Exact
            value: /executive
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-noc-executive/rrq-executive-noc
            statusCode: 302
    # Platform Infrastructure Shortcuts
    - matches:
        - path:
            type: Exact
            value: /infrastructure
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-platform-infra/rrq-platform-infrastructure
            statusCode: 302
    # Microservice Deep Dives
    - matches:
        - path:
            type: Exact
            value: /services/core-api
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-svc-core-api/rrq-core-api
            statusCode: 302
    - matches:
        - path:
            type: Exact
            value: /services/outbox-relay
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-svc-outbox-relay/rrq-outbox-relay
            statusCode: 302
    - matches:
        - path:
            type: Exact
            value: /services/ledger
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-svc-ledger-worker/rrq-ledger-worker
            statusCode: 302
    - matches:
        - path:
            type: Exact
            value: /services/webhook
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-svc-webhook-worker/rrq-webhook-worker
            statusCode: 302
    - matches:
        - path:
            type: Exact
            value: /services/fraud
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-svc-fraud-worker/rrq-fraud-worker
            statusCode: 302
    - matches:
        - path:
            type: Exact
            value: /services/recon
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-svc-recon-worker/rrq-recon-worker
            statusCode: 302
    # Default Grafana Backend Route
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          namespace: observability
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: growth-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "growth.127.0.0.1.nip.io"
    - "growth.rrq.yotstack.tech"
  rules:
    # Direct Root Landing Page for Business Operations & Growth Dashboard
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/rrq-business-ops/rrq-business-operations
            statusCode: 302
    # Default Grafana Backend Route
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          namespace: observability
          port: 80
---
# Reference Grants to authorize the 'rrq' namespace routes to connect to these service backends

apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-rrq-route-to-portainer
  namespace: portainer
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: rrq
  to:
    - group: ""
      kind: Service
      name: portainer
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-rrq-route-to-observability
  namespace: observability
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: rrq
  to:
    - group: ""
      kind: Service
      name: kube-prometheus-stack-grafana
    - group: ""
      kind: Service
      name: kube-prometheus-stack-prometheus
    - group: ""
      kind: Service
      name: kibana-kb-http
    - group: ""
      kind: Service
      name: jaeger-collector
