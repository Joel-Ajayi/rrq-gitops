# Unprotected edge routes (no auth)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rrq-public-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "api.127.0.0.1.nip.io"
    - "api.rrq.yotstack.tech"
  rules:
    - matches:
        - path:
            type: Exact
            value: /health
        - path:
            type: Exact
            value: /ready
        - path:
            type: Exact
            value: /.well-known/jwks.json
        - path:
            type: Exact
            value: /v1/auth/token
      backendRefs:
        - name: core-api
          port: 8080
---
# Protected edge route for all /v1/* resources (JWT-verified via SecurityPolicy)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rrq-protected-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "api.127.0.0.1.nip.io"
    - "api.rrq.yotstack.tech"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: core-api
          port: 8080
