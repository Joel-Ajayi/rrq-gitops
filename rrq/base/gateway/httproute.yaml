# Unprotected edge route for authentication & JWKS public key discovery
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rrq-public-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/auth/token
        - path:
            type: Exact
            value: /.well-known/jwks.json
      backendRefs:
        - name: core-api
          port: 8080
---
# Protected edge route for all core platform API resources (JWT-verified)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rrq-protected-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: core-api
          port: 8080
