apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - collector.yaml
  - instrumentation.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - alertmanagerconfig.yaml
  - secret.sealed.yaml
  - elastic.yaml
  - dashboards

#   [ RRQ NAMESPACE ]                               [ OBSERVABILITY NAMESPACE ]
#
#   ┌────────────────────────┐
#   │    APPLICATION PODS    ├───────────────────────┐
