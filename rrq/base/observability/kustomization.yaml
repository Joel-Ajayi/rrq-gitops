#               │                                    ▼
#               │ (OTLP Traces          ┌───────────────────────────┐
#               │  & Metrics)           │     filelog receiver      │
#               ▼                       └────────────┬──────────────┘
#   ┌────────────────────────┐                       │ (Tails Logs)
#   │     OpenTelemetry      │◄──────────────────────┘
#   │   Collector DaemonSet  ├───────────────────► [ Elasticsearch ] ──► [ Kibana UI ]
#   └──────┬──────────┬──────┘                        (Feeds Logs)
#          │          │
#          │          │ (OTLP/gRPC Traces)            ┌─────────────┐
#          │          ├──────────────────────────────►│   Jaeger    │───┐
#          │          │                               └─────────────┘   │
#          │          ▼                                                 │ (Feeds
#          │  ┌───────────────┐                                         │  Traces)
#          │  │ServiceMonitor │                                         │
#          ▼  └───────┬───────┘                                         │
#   ┌───────────────┐ │ (Scrapes Metrics on Port 8889)                  │
#   │  Prometheus   │◄┘                                                 │
#   └───────┬───┬───┘                                                   │
#           │   │                                                       │
#           │   └───────────────(Feeds Metrics)────────────────┐        │
#           ▼                                                  ▼        ▼
#   ┌───────────────┐                                    ┌────────────────────┐
#   │ Alertmanager  │                                    │     Grafana UI     │
#   └────────────────┘                                    └────────────────────┘
