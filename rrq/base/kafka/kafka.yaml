# Strimzi-managed Kafka, KRaft mode (no ZooKeeper).
# KafkaNodePool = the pods; Kafka = the cluster. Bootstrap: rrq-kafka-bootstrap.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: rrq
  labels:
    strimzi.io/cluster: rrq
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests: { cpu: "250m", memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/name
                    operator: In
                    values:
                      - rrq-kafka
              topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: rrq
  namespace: rrq
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal #loadbalancer for external access; internal for in-cluster access.
        tls: false #true when fully encrypted pathway using TLS certificates for secure internal microservices transferring sensitive data across different namespaces.
    config:
      offsets.topic.replication.factor: 3 # Controls the replication factor of the internal __consumer_offsets topic
      transaction.state.log.replication.factor: 3 # Controls the replication factor of the internal __transaction_state topic
      # Defines the minimum number of In-Sync Replicas (ISR) required for the transaction state manager to accept incoming write requests
      transaction.state.log.min.isr: 2
      # Controls the default replication factor for user-created topics in Kafka
      default.replication.factor: 3
      #  Sets the minimum number of replicas that must acknowledge a write for it to be considered successful when a producer uses acks=all
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
