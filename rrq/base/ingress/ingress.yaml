# Protected edge routing via Kong.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rrq-edge-protected
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
  annotations:
    konghq.com/plugins: rrq-rate-limit,rrq-jwt
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: core-api
                port: { number: 8080 }
---
# Unprotected edge routing via Kong.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rrq-edge-public
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
  annotations:
    konghq.com/plugins: rrq-rate-limit
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /v1/auth/token
            pathType: Exact
            backend:
              service:
                name: core-api
                port: { number: 8080 }
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-dashboard
                port: { number: 8081 }
