# Non-secret configuration shared by every RRQ service. Secrets (DB passwords,
# JWT signing key, HMAC keys) live in a Secret / SealedSecret, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-config
  namespace: rrq
data:
  # --- Global control-plane database: merchants + the shard routing directory ---
  PG_MERCHANTS_HOST: "merchants-db-rw.rrq.svc.cluster.local"
  PG_MERCHANTS_PORT: "5432"
  PG_MERCHANTS_DB: "merchants"

  # --- Ledger shards. The gateway resolves merchant_id -> shard_id from
  #     merchants.shard_id, then dials the matching host below. ---
  PG_SHARD_PORT: "5432"
  PG_SHARD_DB: "rrq"
  SHARD_A_HOST: "shard-a-rw.rrq.svc.cluster.local"
  SHARD_B_HOST: "shard-b-rw.rrq.svc.cluster.local"

  # --- Messaging ---
  KAFKA_BROKERS: "rrq-kafka-bootstrap.rrq.svc.cluster.local:9092"
  KAFKA_TOPIC_JOBS: "jobs"
  KAFKA_TOPIC_NOTIFY: "notify"

  # --- Ephemeral, non-correctness-critical state ---
  REDIS_DATA_HOST: "redis-master.rrq.svc.cluster.local"
  REDIS_DATA_PORT: "6379"

  # --- Behaviour ---
  LOG_LEVEL: "info"
  TRACE_SAMPLE_RATE: "0.1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://platform-collector-collector.observability.svc.cluster.local:4317"

  #  jwt
  BCRYPT_COST: "12"
  JWT_ACTIVE_KEY_ID: "default"

  # --- Kong API Gateway Integration ---
  KONG_CONFIG_API_VERSION: "configuration.konghq.com/v1"
  KONG_API_GROUP: "configuration.konghq.com"
  KONG_API_VERSION: "v1"
  KONG_RESOURCE_CONSUMERS: "kongconsumers"
  KONG_RESOURCE_PLUGINS: "kongplugins"
  KONG_RESOURCE_CREDENTIALS: "kongcredentials"
  KONG_KIND_CONSUMER: "KongConsumer"
  KONG_KIND_PLUGIN: "KongPlugin"
  KONG_KIND_CREDENTIAL: "KongCredential"
  KONG_PLUGIN_RATE_LIMITING: "rate-limiting"
  KONG_PLUGIN_POLICY: "local"
  KONG_CREDENTIAL_TYPE_JWT: "jwt"
  KONG_JWT_ALGORITHM: "RS256"
