# Shared base; overlays patch per-env. Stateful topology identical in both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config/platform-configmap.yaml
  - config/core-api-configmap.yaml
  - config/ledger-worker-configmap.yaml
  - config/fraud-worker-configmap.yaml
  - config/webhook-worker-configmap.yaml
  - config/outbox-relay-configmap.yaml
  - config/rrq-config.yaml
  - postgres
  - kafka
  - services
  - gateway # Envoy Gateway + Gateway API edge routing
