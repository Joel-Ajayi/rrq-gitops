apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: rrq
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: rrq
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        app.kubernetes.io/part-of: rrq
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: core-api
          image: rrq/core-api-go
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          envFrom:
            - configMapRef:
                name: rrq-config
            - secretRef:
                name: rrq-secrets
          env:
            - name: MERCHANTS_DB_URI
              valueFrom:
                secretKeyRef:
                  name: merchants-db-app
                  key: uri
            - name: SHARD_A_URI
              valueFrom:
                secretKeyRef:
                  name: shard-a-app
                  key: uri
            - name: SHARD_B_URI
              valueFrom:
                secretKeyRef:
                  name: shard-b-app
                  key: uri
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - core-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: rrq
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: rrq
spec:
  selector:
    app.kubernetes.io/name: core-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# controls scaling based on LOAD
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-api
  namespace: rrq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# controls availability during DISRUPTIONS (e.g. node maintenance)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-api
  namespace: rrq
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
