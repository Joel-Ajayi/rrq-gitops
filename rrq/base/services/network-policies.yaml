# 1. Default Deny Ingress
# Drops all incoming traffic to all pods in the rrq namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# 2. Default Deny Egress
# Blocks all outgoing traffic from all pods in the rrq namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Egress

---
# 3. Allow Prometheus metrics scraping for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 9090

---
# 4. Allow Ingress Controller (Kong) to reach core-api on port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-core-api
  namespace: rrq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: core-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kong
    ports:
    - protocol: TCP
      port: 8080

---
# 5. Allow Ingress Controller (Kong) to reach admin-dashboard on port 8081
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-admin-dashboard
  namespace: rrq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admin-dashboard
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kong
    ports:
    - protocol: TCP
      port: 8081

---
# 6. Allow egress to PostgreSQL (merchants + shards)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 5432

---
# 7. Allow egress to Kafka (bootstrap + broker ports)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-kafka
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: strimzi-system
    ports:
    - protocol: TCP
      port: 9092

---
# 8. Allow intra-namespace pod-to-pod communication (for gRPC if needed)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
---
# 9. Allow egress to DNS (CoreDNS in kube-system)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# 10. Allow egress to OpenTelemetry Collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
           kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 4317

---
# 11. Allow egress to Kubernetes API Server (for kong-sync-worker)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-kube-api
  namespace: rrq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong-sync-worker
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 443