# 1. Default Deny Ingress
# Drops all incoming traffic to all pods in the rrq namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
    - Ingress


# NOTE: Egress policies are intentionally omitted.
# kindnet (kind's default CNI) silently drops ALL egress (including to the
# API server) when ANY policy with policyTypes: [Egress] is present.
# Re-introduce egress policies only when using a proper CNI.

---
# 2. Allow Prometheus metrics scraping from observability namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9090

---
# 3. Allow Envoy Gateway to reach core-api on port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-core-api
  namespace: rrq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: core-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080

---
# 4. Allow intra-namespace pod-to-pod communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}

---
# 5. Allow CNPG operator (cnpg-system) to manage CNPG pods on ports 5432 + 8000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-cnpg-operator
  namespace: rrq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: cloudnative-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        # postgres port
        - protocol: TCP
          port: 5432
        # CNPG operator uses this to extract metrics port
        - protocol: TCP
          port: 8000
