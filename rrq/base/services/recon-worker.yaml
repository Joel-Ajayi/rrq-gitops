apiVersion: batch/v1
kind: CronJob
metadata:
  name: recon-worker
  namespace: rrq
  labels:
    app.kubernetes.io/name: recon-worker
    app.kubernetes.io/part-of: rrq
spec:
  # min| Hour | Day of Month | Month | Day of Week
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recon-worker
            app.kubernetes.io/part-of: rrq
        spec:
          restartPolicy: Never
          initContainers:
            - name: wait-for-infra
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  until nc -z shard-a-rw.rrq 5432 2>/dev/null; do
                    echo "Waiting for shard-a Postgres..."
                    sleep 2
                  done
                  until nc -z shard-b-rw.rrq 5432 2>/dev/null; do
                    echo "Waiting for shard-b Postgres..."
                    sleep 2
                  done

          containers:
            - name: recon-worker
              image: rrq/recon-worker:dev
              imagePullPolicy: Never
              envFrom:
                - configMapRef:
                    name: rrq-config
              env:
                - name: MERCHANTS_DB_URI
                  valueFrom:
                    secretKeyRef:
                      name: merchants-db-app
                      key: uri
                - name: SHARD_A_URI
                  valueFrom:
                    secretKeyRef:
                      name: shard-a-app
                      key: uri
                - name: SHARD_B_URI
                  valueFrom:
                    secretKeyRef:
                      name: shard-b-app
                      key: uri
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
