apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong-sync-worker
  namespace: rrq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rrq-kong-sync-role
rules:
  - apiGroups: ["configuration.konghq.com"]
    resources: ["kongconsumers", "kongplugins", "kongcredentials"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rrq-kong-sync-rolebinding
subjects:
  - kind: ServiceAccount
    name: kong-sync-worker
    namespace: rrq
roleRef:
  kind: ClusterRole
  name: rrq-kong-sync-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-sync-worker
  namespace: rrq
  labels:
    app.kubernetes.io/name: kong-sync-worker
    app.kubernetes.io/part-of: rrq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong-sync-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong-sync-worker
        app.kubernetes.io/part-of: rrq
    spec:
      serviceAccountName: kong-sync-worker
      containers:
        - name: kong-sync-worker
          image: rrq/kong-sync-worker:dev
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: rrq-config
            - secretRef:
                name: rrq-secrets
          env:
            - name: MERCHANTS_DB_URI
              valueFrom:
                secretKeyRef:
                  name: merchants-db-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
