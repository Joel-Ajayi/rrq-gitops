# Runs once per `make dev` (and as an Argo CD PreSync hook in prod): global migrations
# on the control-plane DB, shard migrations on every shard. URIs come from CNPG secrets.
apiVersion: batch/v1
kind: Job
metadata:
  name: rrq-migrate
  namespace: rrq
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate-merchants
          image: rrq/migrate:dev
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for merchants DB..."
              until nc -z merchants-db-rw.rrq 5432; do sleep 2; done
              migrate -path /migrations/global -database "$MERCHANTS_URI?sslmode=require" up
          env:
            - name: MERCHANTS_URI
              valueFrom:
                secretKeyRef: { name: merchants-db-app, key: uri }
        
        - name: migrate-shard-a
          image: rrq/migrate:dev
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Shard A DB..."
              until nc -z shard-a-rw.rrq 5432; do sleep 2; done
              migrate -path /migrations/shard -database "$SHARD_A_URI?sslmode=require" up
          env:
            - name: SHARD_A_URI
              valueFrom:
                secretKeyRef: { name: shard-a-app, key: uri }
                
        - name: migrate-shard-b
          image: rrq/migrate:dev
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Shard B DB..."
              until nc -z shard-b-rw.rrq 5432; do sleep 2; done
              migrate -path /migrations/shard -database "$SHARD_B_URI?sslmode=require" up
          env:
            - name: SHARD_B_URI
              valueFrom:
                secretKeyRef: { name: shard-b-app, key: uri }
