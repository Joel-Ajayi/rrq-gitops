apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: rrq
spec:
  template:
    spec:
      containers:
        - name: core-api
          resources:
            requests: { cpu: "500m", memory: 128Mi }
            limits: { cpu: "2", memory: 256Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-api
  namespace: rrq
spec:
  minReplicas: 4
  maxReplicas: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
  namespace: rrq
spec:
  template:
    spec:
      containers:
        - name: fraud-worker
          resources:
            requests: { cpu: "500m", memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fraud-worker
  namespace: rrq
spec:
  minReplicaCount: 4
  maxReplicaCount: 16
---
