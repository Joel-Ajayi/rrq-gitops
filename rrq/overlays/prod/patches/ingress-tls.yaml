# Prod: terminate TLS at Kong with a cert-manager-issued certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rrq-edge-protected
  namespace: rrq
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [rrq.yotstack.tech]
      secretName: rrq-edge-tls-secret
  rules:
    - host: rrq.yotstack.tech
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: core-api
                port: { number: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rrq-edge-public
  namespace: rrq
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [rrq.yotstack.tech]
      secretName: rrq-edge-tls-secret
  rules:
    - host: rrq.yotstack.tech
      http:
        paths:
          - path: /v1/auth/token
            pathType: Exact
            backend:
              service:
                name: core-api
                port: { number: 8080 }
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-dashboard
                port: { number: 8081 }
