# Dev-specific Network Policies
# These supplement the base policies (in ../../../base/services/network-policies.yaml)
# with development-specific allowances.

# Dev: Allow local port-forward / localhost access for debugging
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-local-access
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 127.0.0.0/8
  egress:
  - to:
    - ipBlock:
        cidr: 127.0.0.0/8
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: strimzi-system
    ports:
    - protocol: TCP
      port: 9092

---
# Dev: Allow Prometheus scraping from observability namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape-dev
  namespace: rrq
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 9090