apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rrq-critical-alerts
  namespace: observability
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: rrq.startup.failures
      rules:
        - alert: ServiceCrashLoopBackOff
          # Pod stuck in crash loop — immediate investigation needed
          expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace="rrq"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "The pod {{ $labels.pod }} has failed to initialize and is crashing. Check logs for log.Panic events."
            runbook_url: "https://wiki.rrq.local/runbooks/crash-loop-backoff"

    - name: rrq.core.api
      rules:
        - alert: APIGatewayHTTP5xxRateHigh
          expr: (sum(rate(traces_span_metrics_calls_total{http_status_code=~"5..",service_name="core-api"}[5m])) by (http_route) / sum(rate(traces_span_metrics_calls_total{service_name="core-api"}[5m])) by (http_route)) * 100 > 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "API Gateway HTTP 5xx Error Rate > 1%"
            description: "Synchronous HTTP 5xx error rate exceeds 1% over the last 5 minutes."
            runbook_url: "https://wiki.rrq.local/runbooks/global-sync-error-rate"

        - alert: APIGatewayProcessingLatencyHigh
          expr: histogram_quantile(0.99, sum(rate(traces_span_metrics_duration_seconds_bucket{service_name="core-api",span_kind="SPAN_KIND_SERVER"}[5m])) by (http_route, le)) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API Gateway p99 processing latency > 2s"
            description: "API HTTP Gateway request processing taking too long. Check for backend database lag."
            runbook_url: "https://wiki.rrq.local/runbooks/api-high-latency"

        - alert: APIGatewayIdempotencyConflictSpike
          expr: rate(rrq_idempotency_conflicts_total{service_name="core-api"}[5m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API Gateway high idempotency conflicts spike > 10/5m"
            description: "A spike in idempotency conflicts indicates client retry loops or possible duplicate submissions."
            runbook_url: "https://wiki.rrq.local/runbooks/idempotency-spikes"

        - alert: CoreAPIBulkheadOverload
          expr: rate(rrq_bulkhead_rejections_total{service_name="core-api"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Core-API bulkhead rejecting requests"
            description: "Core-API bulkhead semaphore exhausted. Scale-up or investigate slow DB queries."
            runbook_url: "https://wiki.rrq.local/runbooks/api-bulkhead-overload"


    - name: rrq.ledger.worker
      rules:
        - alert: LedgerDoubleEntryImbalance
          expr: rrq_saga_unresolved_count > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Asynchronous cross-shard saga hanging unresolved > 120s"
            description: "A cross-shard transaction saga has been pending for over 2 minutes. Shard could be down or message lost."
            runbook_url: "https://wiki.rrq.local/runbooks/saga-lag"

        - alert: LedgerWorkerDLQSpike
          # DLQ ingestion > 10/min — poison pills or systemic business rule failures
          expr: rate(rrq_dlq_ingestion_rate{service_name="ledger-worker"}[5m]) > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Ledger Worker DLQ ingestion rate > 10/min"
            description: "Check DLQ for poison messages or systemic business rule failures. Runbook: https://wiki.rrq.local/runbooks/ledger-dlq-spike"
            runbook_url: "https://wiki.rrq.local/runbooks/ledger-dlq-spike"

        - alert: LedgerWorkerDLQWriteFailure
          # DLQ write failed — process may crash, check Postgres connectivity immediately
          expr: increase(rrq_infrastructure_errors_total{component="dlq_store",service_name="ledger-worker"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Ledger Worker failed to write to DLQ - process may crash"
            description: "DLQ store infrastructure error. Check Postgres connectivity for shard. Process will Fatal on next occurrence."
            runbook_url: "https://wiki.rrq.local/runbooks/ledger-dlq-write-failure"

        - alert: LedgerWorkerCBOpen
          # Shard CB open — database pool unhealthy, check infra errors for that shard
          expr: rrq_circuit_breaker_state{service_name="ledger-worker",circuit_breaker=~"shard-.*"} == 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Ledger Worker shard CB Open"
            description: "Circuit breaker for shard {{ $labels.circuit_breaker }} is Open. Database pool likely unhealthy. Check rrq_infrastructure_errors_total for that shard."
            runbook_url: "https://wiki.rrq.local/runbooks/ledger-cb-open"

        - alert: LedgerWorkerProcessingLatencyHigh
          # p99 processing > 10s — slow queries or lock contention
          expr: histogram_quantile(0.99, rate(traces_span_metrics_duration_seconds_bucket{service_name="ledger-worker"}[5m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ledger Worker p99 processing latency > 10s"
            description: "Message processing taking too long. Check for slow queries or lock contention."
            runbook_url: "https://wiki.rrq.local/runbooks/ledger-high-latency"

        - alert: LedgerWorkerBackoffSpike
          # Backoff time > 5min/5min — persistent infrastructure failures
          expr: rate(rrq_consumer_backoff_duration_seconds_sum{service_name="ledger-worker"}[5m]) > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ledger Worker excessive backoff time > 5min/5min"
            description: "Consumer spending excessive time in backoff. Indicates persistent infrastructure failures."
            runbook_url: "https://wiki.rrq.local/runbooks/ledger-backoff-spike"

    - name: rrq.webhook.worker
      rules:
        - alert: WebhookWorkerDLQSpike
          expr: rate(rrq_dlq_ingestion_rate{service_name="webhook-worker"}[5m]) > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Webhook Worker DLQ ingestion rate > 5/min"
            description: "Webhook deliveries failing repeatedly and routing to DLQ."
            runbook_url: "https://wiki.rrq.local/runbooks/webhook-dlq-spike"

        - alert: WebhookWorkerDLQWriteFailure
          expr: increase(rrq_infrastructure_errors_total{component="dlq_store",service_name="webhook-worker"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Webhook Worker failed to write to DLQ"
            description: "Webhook DLQ store write failure. Connectivity issue to postgres shard."
            runbook_url: "https://wiki.rrq.local/runbooks/webhook-dlq-write-failure"

        - alert: WebhookWorkerCBOpen
          expr: rrq_circuit_breaker_state{service_name="webhook-worker",circuit_breaker=~"merchant-.*"} == 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Webhook Worker Merchant CB Open"
            description: "Webhook circuit breaker for merchant {{ $labels.circuit_breaker }} is Open. Webhook endpoint down or failing."
            runbook_url: "https://wiki.rrq.local/runbooks/webhook-cb-open"

        - alert: WebhookWorkerProcessingLatencyHigh
          expr: histogram_quantile(0.99, rate(traces_span_metrics_duration_seconds_bucket{service_name="webhook-worker"}[5m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Webhook Worker p99 processing latency > 10s"
            description: "Webhook delivery consumer taking too long to execute retry loops."
            runbook_url: "https://wiki.rrq.local/runbooks/webhook-high-latency"

    - name: rrq.outbox.relay
      rules:
        - alert: OutboxLagCritical
          expr: rrq_outbox_lag_seconds{service_name="outbox-relay"} > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Outbox Relay Lag Critical > 10s"
            description: "Outbox relay oldest unpublished event age exceeds 10s for 2 consecutive poll cycles. Kafka egress or DB pool likely unhealthy."
            runbook_url: "https://wiki.rrq.local/runbooks/outbox-lag-critical"

        - alert: OutboxLagWarning
          expr: rrq_outbox_lag_seconds{service_name="outbox-relay"} > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Outbox Relay Lag Warning > 5s"
            description: "Outbox relay oldest unpublished event age exceeds 5s for 5 consecutive poll cycles. May need scale-up."
            runbook_url: "https://wiki.rrq.local/runbooks/outbox-lag-warning"

        - alert: OutboxDLQIngestion
          expr: rate(rrq_dlq_ingestion_rate{service_name="outbox-relay"}[5m]) > 0.1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Outbox Relay DLQ Ingestion > 0.1/min"
            description: "Outbox events are being routed to DLQ. Investigate corrupted payloads or schema violations in outbox_events."
            runbook_url: "https://wiki.rrq.local/runbooks/outbox-dlq-spike"

        - alert: OutboxKafkaBufferFull
          expr: rrq_kafka_producer_buffer_fill_ratio{service_name="outbox-relay"} > 0.99
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Outbox Relay Kafka Producer Buffer Full"
            description: "Kafka producer buffer fill ratio > 99% for 30s. Kafka broker unreachable or network partitioned."
            runbook_url: "https://wiki.rrq.local/runbooks/outbox-kafka-buffer-full"

        - alert: OutboxRelayShardCBOpen
          expr: rrq_circuit_breaker_state{service_name="outbox-relay",circuit_breaker=~"shard-rw-.*|shard-ro-.*"} == 2
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Outbox Relay Shard DB Circuit Breaker Open"
            description: "Per-shard DB circuit breaker {{ $labels.circuit_breaker }} is Open. Database pool for shard likely unhealthy. Check Postgres connectivity."
            runbook_url: "https://wiki.rrq.local/runbooks/outbox-cb-open"

        - alert: OutboxRelayPanicRate
          expr: rate(rrq_outbox_panics_total{service_name="outbox-relay"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Outbox Relay Panic Rate > 0"
            description: "Panic recovered in outbox-relay batch loop."
            runbook_url: "https://wiki.rrq.local/runbooks/outbox-relay-panic"

        - alert: OutboxRelayNoPublish
          expr: rate(rrq_outbox_events_published_total{service_name="outbox-relay"}[5m]) == 0 and rrq_outbox_lag_seconds{service_name="outbox-relay"} > 30
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Outbox relay not publishing despite backlog"
            description: "Outbox relay has a backlog > 30s but no events are being published. Stuck relay loop."
            runbook_url: "https://wiki.rrq.local/runbooks/outbox-relay-stuck"

    - name: rrq.infrastructure
      rules:
        - alert: KafkaConsumerGroupLagHigh
          expr: kafka_consumer_lag{topic=~"jobs|notify"} > 1000
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Kafka consumer group lag high"
            description: "Kafka consumer group lag exceeded 1000 messages for over 3 minutes."
            runbook_url: "https://wiki.rrq.local/runbooks/kafka-lag"

        - alert: PodOOMKilled
          expr: kube_pod_container_status_terminated_reason{reason="OOMKilled"} > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Pod OOMKilled detected"
            description: "Pod container was terminated due to Out-Of-Memory (OOMKilled)."
            runbook_url: "https://wiki.rrq.local/runbooks/oom-killed"

        - alert: CertificateExpirySoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "SSL Certificate expires in less than 7 days"
            description: "TLS certificate managed by cert-manager will expire within 7 days."
            runbook_url: "https://wiki.rrq.local/runbooks/cert-expiry"

        - alert: PVCVolumeDiskSpaceLow
          expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) * 100 < 15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC Volume Disk Space < 15%"
            description: "Persistent Volume Claim available storage is below 15%."
            runbook_url: "https://wiki.rrq.local/runbooks/pvc-disk-low"

    - name: rrq.fraud.worker
      rules:
        - alert: FraudWorkerDLQSpike
          expr: rate(rrq_dlq_ingestion_rate{service_name="fraud-worker"}[5m]) > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Fraud Worker DLQ ingestion rate > 5/min"
            description: "Velocity checking failed messages routing to DLQ."
            runbook_url: "https://wiki.rrq.local/runbooks/fraud-dlq-spike"

        - alert: FraudWorkerCBOpen
          expr: rrq_circuit_breaker_state{service_name="fraud-worker",circuit_breaker=~"shard-.*"} == 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Fraud Worker DB Shard CB Open"
            description: "Circuit breaker for database shard {{ $labels.circuit_breaker }} in Fraud Worker is Open."
            runbook_url: "https://wiki.rrq.local/runbooks/fraud-cb-open"


    - name: rrq.business
      rules:
        - alert: BusinessTSRDrop
          expr: (sum(rate(rrq_business_transfers_total{status="failed"}[5m])) / sum(rate(rrq_business_transfers_total{}[5m]))) * 100 > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Transfer Success Rate dropped below 95%"
            description: "Transfer success rate is below 95% over the last 5 minutes. Investigate decline reasons and infrastructure health."
            runbook_url: "https://wiki.rrq.local/runbooks/tsr-drop"

        - alert: BusinessGTVAnomaly
          expr: rate(rrq_business_gtv_total[10m]) < 100 and on() rate(rrq_business_transfers_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No Gross Transaction Value flowing through system"
            description: "No successful transfer value recorded in the last 10 minutes despite active transfers. Check ledger worker."
            runbook_url: "https://wiki.rrq.local/runbooks/gtv-anomaly"

        - alert: SagaFailureRateHigh
          expr: (sum(rate(rrq_business_transfers_total{status="failed",shard_type="cross"}[5m])) / sum(rate(rrq_business_transfers_total{shard_type="cross"}[5m]))) * 100 > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Cross-shard saga failure rate > 10%"
            description: "More than 10% of cross-shard sagas are failing. Investigate xshard settlement or clearing account issues."
            runbook_url: "https://wiki.rrq.local/runbooks/saga-failure"

        - alert: FraudVelocityLimitExceeded
          expr: rate(rrq_velocity_limit_exceeded_total[5m]) > 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Velocity limit violated > 5 times in 5 minutes"
            description: "Fraud worker detected excessive velocity limit violations. Possible automated attack or misconfigured rule."
            runbook_url: "https://wiki.rrq.local/runbooks/velocity-spike"


        - alert: ConsumerBackoffDominant
          expr: rate(rrq_consumer_backoff_duration_seconds_sum[5m]) / 300 > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Consumer spending > 50% of time in backoff"
            description: "Consumers across the system are spending excessive time in backoff. Persistent infrastructure failures likely."
            runbook_url: "https://wiki.rrq.local/runbooks/consumer-backoff"

    - name: rrq.retry.budget
      rules:
        - alert: RetryBudgetExhaustedHigh
          expr: rate(rrq_retry_budget_exhausted_total[5m]) > 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Retry Budget Exhausted across microservices"
            description: "Token bucket retry budget exhausted for service {{ $labels.service_name }}. Retries failing fast to prevent thundering herd load amplification."
            runbook_url: "https://wiki.rrq.local/runbooks/retry-budget-exhausted"

    - name: rrq.recon.worker
      rules:
        - alert: ReconDiscrepancyDetected
          expr: increase(rrq_recon_discrepancies_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Reconciliation Discrepancy Detected"
            description: "Reconciliation worker detected ledger balance drift or posting integrity mismatch across shards."
            runbook_url: "https://wiki.rrq.local/runbooks/recon-discrepancy"
