apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-svc-core-api
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-svc-core-api.json: |-
    {
      "title": "RRQ Core API",
      "uid": "rrq-svc-core-api",
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "tags": ["rrq", "tier-2"],
      "panels": [
        {
          "type": "timeseries",
          "title": "Latency P50/P95/P99",
          "gridPos": { "h": 8, "w": 3, "x": 0, "y": 0 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(traces_span_metrics_duration_seconds_bucket{service_name=\"core-api\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) by (le))", "legendFormat": "P50" },
            { "expr": "histogram_quantile(0.95, sum(rate(traces_span_metrics_duration_seconds_bucket{service_name=\"core-api\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) by (le))", "legendFormat": "P95" },
            { "expr": "histogram_quantile(0.99, sum(rate(traces_span_metrics_duration_seconds_bucket{service_name=\"core-api\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) by (le))", "legendFormat": "P99" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Request Rate (RPS)",
          "gridPos": { "h": 8, "w": 3, "x": 3, "y": 0 },
          "targets": [{
            "expr": "sum(rate(traces_span_metrics_calls_total{service_name=\"core-api\",span_kind=\"SPAN_KIND_SERVER\"}[1m])) by (http_route)",
            "legendFormat": "{{http_route}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "type": "timeseries",
          "title": "Error Rate by Code",
          "gridPos": { "h": 8, "w": 3, "x": 6, "y": 0 },
          "targets": [{
            "expr": "sum(rate(traces_span_metrics_calls_total{service_name=\"core-api\",http_status_code=~\"[45]..\"}[5m])) by (http_status_code)",
            "legendFormat": "HTTP {{http_status_code}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Wallet Creations / Deposits",
          "gridPos": { "h": 8, "w": 3, "x": 9, "y": 0 },
          "targets": [
            { "expr": "sum(rate(rrq_business_wallets_created_total[5m]))", "legendFormat": "Wallet Creations" },
            { "expr": "sum(rate(rrq_business_deposits_total[5m]))", "legendFormat": "Deposits" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        }
      ]
    }
