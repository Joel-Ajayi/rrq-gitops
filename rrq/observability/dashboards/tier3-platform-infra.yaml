apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-platform-infra
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-platform-infra.json: |-
    {
      "title": "RRQ Platform Infrastructure",
      "uid": "rrq-platform-infra",
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "tags": ["rrq", "tier-3"],
      "panels": [
        {
          "type": "timeseries",
          "title": "Node CPU Usage %",
          "gridPos": { "h": 8, "w": 3, "x": 0, "y": 0 },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"rrq\"}[5m])) by (node) / sum(kube_node_status_allocatable{resource=\"cpu\"}) by (node) * 100",
            "legendFormat": "{{node}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "Node Memory Usage %",
          "gridPos": { "h": 8, "w": 3, "x": 3, "y": 0 },
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{namespace=\"rrq\"}) by (node) / sum(kube_node_status_allocatable{resource=\"memory\"}) by (node) * 100",
            "legendFormat": "{{node}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "Pod Restarts (1h)",
          "gridPos": { "h": 8, "w": 3, "x": 6, "y": 0 },
          "targets": [{
            "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"rrq\"}[1h])) by (pod)",
            "legendFormat": "{{pod}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "CoreDNS Latency P99",
          "gridPos": { "h": 8, "w": 3, "x": 9, "y": 0 },
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(coredns_dns_request_duration_seconds_bucket[5m]))",
            "legendFormat": "P99"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Kafka Broker Disk %",
          "gridPos": { "h": 8, "w": 3, "x": 0, "y": 8 },
          "targets": [{
            "expr": "kafka_log_disk_usage_bytes / kafka_log_disk_capacity_bytes * 100",
            "legendFormat": "disk %"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "Under-Replicated Partitions",
          "gridPos": { "h": 8, "w": 3, "x": 3, "y": 8 },
          "targets": [{
            "expr": "kafka_topic_partition_under_replicated",
            "legendFormat": "{{topic}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Consumer Group Lag (Top 10)",
          "gridPos": { "h": 8, "w": 3, "x": 6, "y": 8 },
          "targets": [{
            "expr": "topk(10, kafka_consumer_group_lag)",
            "legendFormat": "{{group}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Kafka Request Latency P99",
          "gridPos": { "h": 8, "w": 3, "x": 9, "y": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(kafka_network_requestmetrics_request_latency_bucket[5m]))",
            "legendFormat": "P99"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Redis Memory %",
          "gridPos": { "h": 8, "w": 3, "x": 0, "y": 16 },
          "targets": [{
            "expr": "redis_memory_used_bytes / redis_memory_max_bytes * 100",
            "legendFormat": "memory %"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "Redis Hit Rate",
          "gridPos": { "h": 8, "w": 3, "x": 3, "y": 16 },
          "targets": [{
            "expr": "redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total)",
            "legendFormat": "hit rate"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } }
        },
        {
          "type": "timeseries",
          "title": "Redis Connected Clients",
          "gridPos": { "h": 8, "w": 3, "x": 6, "y": 16 },
          "targets": [{
            "expr": "redis_connected_clients",
            "legendFormat": "clients"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Redis Cmd Latency P99",
          "gridPos": { "h": 8, "w": 3, "x": 9, "y": 16 },
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(redis_command_duration_seconds_bucket[5m]))",
            "legendFormat": "P99"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        }
      ]
    }
