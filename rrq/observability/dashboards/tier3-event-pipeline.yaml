apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier3-event-pipeline
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-tier3-event-pipeline.json: |-
    {
      "title": "Tier 3: Async & Messaging Pipeline",
      "uid": "tier3-event-pipeline",
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["rrq", "tier-3"],
      "templating": {
        "list": [
          {
            "name": "topic",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(kafka_consumer_group_lag, topic)",
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true
          },
          {
            "name": "consumer_group",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(kafka_consumer_group_lag, group)",
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Consumer Group Lag",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{
            "expr": "sum(kafka_consumer_group_lag{topic=~\"$topic\", group=~\"$consumer_group\"}) by (group, topic)",
            "legendFormat": "{{group}} - {{topic}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "type": "timeseries",
          "title": "Outbox Relay Lag",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{
            "expr": "rrq_outbox_lag_seconds",
            "legendFormat": "{{service_name}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "DLQ Ingestion Rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{
            "expr": "sum(rate(rrq_dlq_ingestion_rate[1m])) by (service_name)",
            "legendFormat": "{{service_name}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "type": "timeseries",
          "title": "Webhook Delivery Status",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{
            "expr": "sum(rate(rrq_webhook_deliveries_total[1m])) by (status)",
            "legendFormat": "{{status}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
        },
        {
          "type": "timeseries",
          "title": "Outbox Relay Poll RPS",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [{
            "expr": "sum(rate(pg_stat_statements_calls{query=~\"(?i).*SELECT.*outbox.*\"}[1m])) by (server)",
            "legendFormat": "{{server}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
        },
        {
          "type": "timeseries",
          "title": "Kafka Consume RPS",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [{
            "expr": "sum(rate(kafka_consumer_offset{topic=~\"$topic\", group=~\"$consumer_group\"}[1m])) by (group, topic)",
            "legendFormat": "{{group}} - {{topic}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
        },
        {
          "type": "timeseries",
          "title": "Webhook Outbound HTTP Latency (P50/P99)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(traces_span_metrics_duration_seconds_bucket{span_kind=\"SPAN_KIND_CLIENT\"}[5m])) by (le, service_name))", "legendFormat": "{{service_name}} - P50" },
            { "expr": "histogram_quantile(0.99, sum(rate(traces_span_metrics_duration_seconds_bucket{span_kind=\"SPAN_KIND_CLIENT\"}[5m])) by (le, service_name))", "legendFormat": "{{service_name}} - P99" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
        },
        {
          "type": "timeseries",
          "title": "Peak Partition Consume RPS Per Pod (partition_consume_rps validation)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [{
            "expr": "max(rate(kafka_consumer_offset{topic=~\"$topic\", group=~\"$consumer_group\"}[1m])) by (pod)",
            "legendFormat": "{{pod}} - Peak RPS"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "type": "timeseries",
          "title": "Peak Produce RPS Per Pod (producer_throughput_rps validation)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [{
            "expr": "max(rate(kafka_producer_record_send_total[1m])) by (pod)",
            "legendFormat": "{{pod}} - Peak RPS"
          }],
        },
        {
          "type": "timeseries",
          "title": "Producer AIMD Buffer Fill Ratio",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "targets": [{
            "expr": "rrq_kafka_producer_buffer_fill_ratio{service_name=\"$service_name\"}",
            "legendFormat": "{{shard}} - Buffer Fill %"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } }
        },
        {
          "type": "timeseries",
          "title": "Task Channel Fill & Coordinator Queue",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 40 },
          "targets": [
            { "expr": "rrq_task_channel_fill_ratio{service_name=\"$service_name\"}", "legendFormat": "{{topic}}/{{partition}} - Task Channel Fill %" },
            { "expr": "rrq_commit_coordinator_queue_depth{service_name=\"$service_name\"}", "legendFormat": "{{topic}}/{{partition}} - Coord Queue" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Outbox Publishing RPS & Panics",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
          "targets": [
            { "expr": "sum(rate(rrq_outbox_events_published_total{service_name=\"$service_name\"}[1m])) by (shard)", "legendFormat": "{{shard}} - Publish (RPS)" },
            { "expr": "sum(rate(rrq_outbox_panics_total{service_name=\"$service_name\"}[1m])) by (shard)", "legendFormat": "{{shard}} - Panics" },
            { "expr": "sum(rate(rrq_consumer_panics_total{service_name=\"$service_name\"}[1m])) by (topic)", "legendFormat": "{{topic}} - Consumer Panics" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Consumer Backoff Duration (Seconds)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 48 },
          "targets": [{
            "expr": "sum(rate(rrq_consumer_backoff_duration_seconds_sum{service_name=\"$service_name\"}[1m])) by (topic) / sum(rate(rrq_consumer_backoff_duration_seconds_count{service_name=\"$service_name\"}[1m])) by (topic)",
            "legendFormat": "{{topic}} - Avg Backoff"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "DLQ Infra Floods vs Replays",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 56 },
          "targets": [
            { "expr": "sum(rate(rrq_dlq_infrastructure_flood_total{service_name=\"$service_name\"}[1m])) by (service_name)", "legendFormat": "Infra Floods" },
            { "expr": "sum(rate(rrq_admin_dlq_replayed_total{service_name=\"$service_name\"}[1m])) by (shard)", "legendFormat": "{{shard}} - Replayed" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        }
      ]
    }
