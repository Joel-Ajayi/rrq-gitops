apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier4-capacity-bottlenecks
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-tier4-capacity-bottlenecks.json: |-
    {
      "title": "Tier 4: Infrastructure & Capacity Bottlenecks",
      "uid": "tier4-capacity-bottlenecks",
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["rrq", "tier-4"],
      "panels": [
        {
          "type": "timeseries",
          "title": "PostgreSQL Client Pool Utilization (Acquired vs Max)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rrq_pg_pool_acquired_conns) by (service_name)", "legendFormat": "{{service_name}} - Acquired" },
            { "expr": "sum(rrq_pg_pool_max_conns) by (service_name)", "legendFormat": "{{service_name}} - Max" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "PostgreSQL Empty Acquire Count (Starvation)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{
            "expr": "sum(rate(rrq_pg_pool_empty_acquire_count[1m])) by (service_name)",
            "legendFormat": "{{service_name}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "type": "timeseries",
          "title": "PostgreSQL Query Latency P99",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.99, sum(rate(traces_span_metrics_duration_seconds_bucket{db_system_name=\"postgresql\"}[5m])) by (le, service_name))",
            "legendFormat": "{{service_name}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Redis Memory Fragmentation Ratio",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{
            "expr": "redis_memory_fragmentation_ratio",
            "legendFormat": "Ratio"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Kafka Broker Disk %",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [{
            "expr": "kafka_log_disk_usage_bytes / kafka_log_disk_capacity_bytes * 100",
            "legendFormat": "disk %"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "Kafka Under-Replicated Partitions",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [{
            "expr": "kafka_topic_partition_under_replicated",
            "legendFormat": "{{topic}}"
          }],
        },
        {
          "type": "timeseries",
          "title": "PostgreSQL Active vs Idle Sessions",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            { "expr": "sum(pg_stat_activity_count{state=\"active\"}) by (server)", "legendFormat": "{{server}} - Active" },
            { "expr": "sum(pg_stat_activity_count{state=\"idle\"}) by (server)", "legendFormat": "{{server}} - Idle" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "PostgreSQL Max Parallel Workers Per Gather",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [{
            "expr": "pg_settings_max_parallel_workers_per_gather",
            "legendFormat": "{{server}}"
          }],
        },
        {
          "type": "timeseries",
          "title": "PostgreSQL Query Latency (Mean)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [{
            "expr": "sum(rate(traces_span_metrics_duration_seconds_sum{db_system_name=\"postgresql\"}[5m])) by (service_name) / sum(rate(traces_span_metrics_duration_seconds_count{db_system_name=\"postgresql\"}[5m])) by (service_name)",
            "legendFormat": "{{service_name}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Redis Query Latency (Mean & P99)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            { "expr": "sum(rate(traces_span_metrics_duration_seconds_sum{db_system_name=\"redis\"}[5m])) by (service_name) / sum(rate(traces_span_metrics_duration_seconds_count{db_system_name=\"redis\"}[5m])) by (service_name)", "legendFormat": "{{service_name}} - Mean" },
            { "expr": "histogram_quantile(0.99, sum(rate(traces_span_metrics_duration_seconds_bucket{db_system_name=\"redis\"}[5m])) by (le, service_name))", "legendFormat": "{{service_name}} - P99" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        }
      ]
    }
