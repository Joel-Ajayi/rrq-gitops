apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier1-business-kpis
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-tier1-business-kpis.json: |-
    {
      "title": "Tier 1: Executive & Business Operations",
      "uid": "tier1-business-kpis",
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["rrq", "tier-1"],
      "panels": [
        {
          "type": "stat",
          "title": "Global Transaction Success Rate",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "targets": [{
            "expr": "sum(rate(rrq_business_transfers_total{status=\"success\"}[5m])) / sum(rate(rrq_business_transfers_total[5m])) * 100",
            "legendFormat": "TSR"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "red", "value": 99 },
                  { "color": "yellow", "value": 99.9 },
                  { "color": "green", "value": 99.95 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "System Throughput (TPS)",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "targets": [{
            "expr": "sum(rate(rrq_business_transfers_total[1m]))",
            "legendFormat": "TPS"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "type": "stat",
          "title": "Global Transfer Value Rate (GTV)",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "targets": [{
            "expr": "sum(rate(rrq_business_gtv_total[1m]))",
            "legendFormat": "GTV / sec"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "currencyNGN" } }
        },
        {
          "type": "gauge",
          "title": "Ledger Imbalance (MUST BE ZERO)",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "targets": [{
            "expr": "rrq_ledger_imbalance_total",
            "legendFormat": "Total"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Transfer Success Rate (1h)",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 8 },
          "targets": [{
            "expr": "sum(rate(rrq_business_transfers_total{status=\"success\"}[5m])) / sum(rate(rrq_business_transfers_total[5m])) * 100",
            "legendFormat": "TSR"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "Throughput by Status (1h)",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 8 },
          "targets": [{
            "expr": "sum(rate(rrq_business_transfers_total[1m])) by (status)",
            "legendFormat": "{{status}}"
          }],
        },
        {
          "type": "timeseries",
          "title": "Cross-Shard Sagas Unresolved",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 18 },
          "targets": [{
            "expr": "rrq_saga_unresolved_count",
            "legendFormat": "Unresolved Sagas"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Fraud Velocity Limit Violations",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 18 },
          "targets": [{
            "expr": "sum(rate(rrq_velocity_limit_exceeded_total[1m])) by (limit_type)",
            "legendFormat": "{{limit_type}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        }
      ]
    }
