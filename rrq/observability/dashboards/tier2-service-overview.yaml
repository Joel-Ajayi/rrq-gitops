apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier2-service-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-tier2-service-overview.json: |-
    {
      "title": "Tier 2: Universal Service Overview",
      "uid": "tier2-service-overview",
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["rrq", "tier-2"],
      "templating": {
        "list": [
          {
            "name": "service_name",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(traces_span_metrics_calls_total, service_name)",
            "refresh": 1,
            "sort": 1,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Rate (RPS)",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "targets": [{
            "expr": "sum(rate(traces_span_metrics_calls_total{service_name=\"$service_name\", span_kind=\"SPAN_KIND_SERVER\"}[1m])) by (span_name)",
            "legendFormat": "{{span_name}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "type": "timeseries",
          "title": "Error Rate (EPS)",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "targets": [{
            "expr": "sum(rate(traces_span_metrics_calls_total{service_name=\"$service_name\", status_code=\"STATUS_CODE_ERROR\", span_kind=\"SPAN_KIND_SERVER\"}[1m])) by (span_name)",
            "legendFormat": "{{span_name}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "type": "timeseries",
          "title": "Latency P50/P95/P99",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(traces_span_metrics_duration_seconds_bucket{service_name=\"$service_name\"}[5m])) by (le))", "legendFormat": "P50" },
            { "expr": "histogram_quantile(0.95, sum(rate(traces_span_metrics_duration_seconds_bucket{service_name=\"$service_name\"}[5m])) by (le))", "legendFormat": "P95" },
            { "expr": "histogram_quantile(0.99, sum(rate(traces_span_metrics_duration_seconds_bucket{service_name=\"$service_name\"}[5m])) by (le))", "legendFormat": "P99" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Pod CPU Usage",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"rrq\", pod=~\"$service_name-.*\"}[1m])) by (pod)",
            "legendFormat": "{{pod}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cores" } }
        },
        {
          "type": "timeseries",
          "title": "Pod Memory Usage",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{namespace=\"rrq\", pod=~\"$service_name-.*\"}) by (pod)",
            "legendFormat": "{{pod}}"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "timeseries",
          "title": "Open Circuit Breakers",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "targets": [{
            "expr": "rrq_circuit_breaker_state{service_name=\"$service_name\"} == 2",
            "legendFormat": "{{circuit_breaker}}"
          }],
        },
        {
          "type": "timeseries",
          "title": "DB Queries per Request (writes_per_message validation)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [{
            "expr": "sum(rate(traces_span_metrics_calls_total{service_name=\"$service_name\", db_system_name=\"postgresql\"}[1m])) by (service_name) / sum(rate(traces_span_metrics_calls_total{service_name=\"$service_name\", span_kind=\"SPAN_KIND_SERVER\"}[1m])) by (service_name)",
            "legendFormat": "{{service_name}} - Queries/Req"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Throughput Efficiency (rps_per_core validation)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [{
            "expr": "sum(rate(traces_span_metrics_calls_total{service_name=\"$service_name\", span_kind=\"SPAN_KIND_SERVER\"}[1m])) by (service_name) / sum(rate(container_cpu_usage_seconds_total{namespace=\"rrq\", pod=~\"$service_name-.*\"}[1m]))",
            "legendFormat": "{{service_name}} - RPS/Core"
          }],
        },
        {
          "type": "timeseries",
          "title": "Circuit Breaker Events",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            { "expr": "sum(rate(rrq_circuit_breaker_open_total{service_name=\"$service_name\"}[1m])) by (circuit_breaker)", "legendFormat": "{{circuit_breaker}} - Open" },
            { "expr": "sum(rate(rrq_circuit_breaker_half_open_failure{service_name=\"$service_name\"}[1m])) by (circuit_breaker)", "legendFormat": "{{circuit_breaker}} - Half-Open Failure" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "type": "timeseries",
          "title": "Bulkhead Capacity & Rejections",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            { "expr": "sum(rrq_bulkhead_in_flight{service_name=\"$service_name\"}) by (service_name)", "legendFormat": "In-Flight Requests" },
            { "expr": "sum(rate(rrq_bulkhead_rejections_total{service_name=\"$service_name\"}[1m])) by (service_name)", "legendFormat": "Rejections (RPS)" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Idempotency Hits vs Conflicts",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            { "expr": "sum(rate(rrq_idempotency_hits_total{service_name=\"$service_name\"}[1m])) by (service_name)", "legendFormat": "Hits (RPS)" },
            { "expr": "sum(rate(rrq_idempotency_conflicts_total{service_name=\"$service_name\"}[1m])) by (service_name)", "legendFormat": "Conflicts (RPS)" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Peak Outbound HTTP RPS Per Pod (peak_qps_per_pod validation)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [{
            "expr": "max(rate(traces_span_metrics_calls_total{service_name=\"$service_name\", span_kind=\"SPAN_KIND_CLIENT\"}[1m])) by (pod)",
            "legendFormat": "{{pod}} - Peak RPS"
          }],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cps" } }
        }
      ]
    }
