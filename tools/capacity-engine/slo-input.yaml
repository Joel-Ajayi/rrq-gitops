# RRQ Capacity Engine Input
# Every value is either measured (Prometheus/Grafana) or a business requirement.
# No defaults, no fallbacks — the YAML is the sole source of truth.

infrastructure:
  postgres:
    instances:
      merchants:
        cores: 4 # k8s node provisioned vCPU count
        ram_bytes: 8589934592 # k8s node provisioned RAM
        effective_spindles: 1 # used for SSD
        parallel_io_limit: 0 # pg_settings max_worker_processes limit
        work_mem_mb: 16 # DBA tuning - per-query sort memory allocation
      shard-a:
        cores: 4 # k8s node provisioned vCPU count
        ram_bytes: 8589934592 # 8GB k8s node provisioned RAM
        effective_spindles: 1 # used for SSD
        parallel_io_limit: 0 # pg_settings max_worker_processes limit
        work_mem_mb: 16 # DBA tuning - per-query sort memory allocation
      shard-b:
        cores: 4 # k8s node provisioned vCPU count
        ram_bytes: 8589934592 # 8GB k8s node provisioned RAM
        effective_spindles: 1 # used for SSD
        parallel_io_limit: 0 # pg_settings max_worker_processes limit
        work_mem_mb: 16 # DBA tuning - per-query sort memory allocation
    workload:
      session_busy_ratio: 0.54 # Tier 4 | Panel: Postgres Connection Pool Utilization | Metric: pg_pool_acquired_conns
      avg_parallelism: 1 # Tier 4 | Panel: Database Query Latency | Metric: pg_settings
    tuning:
      shared_buffers_pct: 0.25 # Postgres Tuning Guide - 25% RAM allocated to shared_buffers
      os_buffer_pct: 0.25 # OS tuning - memory left for page cache
      maintenance_pct: 0.15 # Postgres Tuning Guide - memory reserved for VACUUM/ANALYZE
    connection:
      max_idle_ms: 600000 # Go pgxpool standard / LB idle timeout threshold (10 min)
      max_lifetime_ms: 1800000 # Firewall / TCP max connection age policy (30 min)

  kafka:
    brokers: 2 # Terraform aws_msk_cluster broker count
    per_broker_partition_cap: 1000 # AWS MSK m5.large recommended max partitions
    replication_factor: 2 # Business Data Durability Policy
    retention_days: 1 # Business Data Retention Policy / GDPR
    segment_seconds: 86400 # Kafka topic 'segment.ms' (must be <= retention)
    broker_fd_ulimit: 65536 # OS level 'ulimit -n' on Kafka brokers
    latency_critical: false # Product Policy - defines if we optimize for throughput vs latency
    partition_consume_rps:
      jobs: 300 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_group_offset_sum_ratio
      xshard.shard-a: 100 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_group_offset_sum_ratio
      xshard.shard-b: 100 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_group_offset_sum_ratio
      notify: 150 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_group_offset_sum_ratio
    reader_min_bytes: 1 # Kafka client 'fetch.min.bytes' tuning
    reader_max_bytes: 1000000 # Kafka client 'max.partition.fetch.bytes' tuning (~1MB)
    reader_max_wait_ms: 500 # Kafka client 'fetch.max.wait.ms' long-polling delay
    writer_max_attempts: 5 # Kafka producer client retry limit

  redis:
    nodes: 1 # Terraform aws_elasticache_cluster node count
    ram_bytes_per_node: 4294967296 # Terraform instance type RAM (4 GiB)
    fork_headroom: 0.0 # Redis docs - 30% safety margin for BGSAVE memory spikes (set to 0 since persistence is disabled)
    fragmentation_factor: 1.25 # Tier 4 | Panel: Redis Memory Fragmentation | Metric: redis_memory_fragmentation_ratio
    per_key_bytes: 160 # Redis 'MEMORY USAGE' command sampling
    ketama_vnodes: 160 # Client consistent hashing virtual nodes standard

  pod:
    cpu_limit_millicores: 1000 # k8s Deployment hardware resource limits
    mem_limit_bytes: 536870912 # k8s Deployment hardware resource limits (512 MiB)

defaults:
  slack_percent: 0.15 # Capacity Team - 15% SLO budget buffer for GC/network overhead
  az_redundancy_factor: 1.5 # Capacity Team - N+1 scaling for 3 Availability Zones (1.5x multiplier)
  growth_headroom: 1.5 # Capacity Team - Future traffic growth buffer (50% headroom)
  retry_budget_fraction: 0.10 # Capacity Team - Max allowable throughput penalty for retries (10%)
  retry_budget_min_tokens: 10 # Baseline token floor to allow initial cold-start retries
  retry_budget_max_tokens: 100 # Token bucket capacity ceiling for retries
  worker_amplification: 1.30 # Capacity Team - Max queueing buildup multiplier under saturation
  worker_floor: 10 # Capacity Team - Absolute minimum worker concurrency floor per pod
  worker_ceil: 200 # Capacity Team - Absolute maximum worker concurrency ceiling per pod
  http_headroom: 1.50 # Capacity Team - Downstream HTTP connection burst multiplier
  pool_floor: 3 # Capacity Team - Absolute minimum worker/connection pool size
  min_replicas: 3 # Capacity Team - Minimum baseline replica floor for KEDA/HPA (N+1 across 3 AZs)
  max_replicas: 10 # Capacity Team - Default maximum replica ceiling for KEDA/HPA

  consumer_session_buffer_ms: 5000 # Capacity Team - Network jitter buffer over ProcessTimeout
  consumer_commit_flush_ms: 1000 # Kafka client 'auto.commit.interval.ms' tuning
  consumer_partition_size: 100 # Go channel buffer capacity per partition
  consumer_max_pending_mb: 64 # Go memory limit per consumer group (OOM protection)
  consumer_min_commit_cap_frac: 0.3 # Minimum batch commit threshold fraction

  dlq_max_retries: 2 # Product Policy - Max synchronous retry attempts before dead-lettering
  relay_max_fetch_batch: 1000 # DB protection - hard limit on PG outbox poll batch size
  otel_exporter_endpoint: "http://agent-collector.observability.svc.cluster.local:4318" # Telemetry endpoint

services:
  # === core-api: synchronous HTTP API gateway ===
  - name: core-api
    slo:
      target: 0.9995 # Product SLO - 99.95% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 2000 # Product SLO - p99 Synchronous Request Latency Deadline
      target_utilization: 0.65 # Capacity Team - Maximum allowed sustained CPU/Pool utilization
    role: api # Architecture definition - synchronous HTTP ingress
    rps_per_core: 2134 # Tier 5 | Panel: Compute Saturation Curve | Metric: process_cpu_seconds_total vs traces_span_metrics_calls_total
    cores_per_pod: 2 # k8s pod CPU allocation profile
    hpa_target_cpu: 0.70 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 536870912 # k8s pod Memory limit (512 MiB)
    jwt_access_hrs: 24 # Security Team - JWT Token expiration policy
    max_request_bytes: 524288 # Security Team - WAF payload size limit (512KB)
    endpoints:
      - name: create-transfer
        nominal_qps: 3000 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        peak_qps: 5000 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        avg_query_time_ms: 38.7 # Tier 4 | Panel: Database Query Latency | Span: POST /v1/transfers
        c_s_squared: 13.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.7 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 2 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: get-balance
        nominal_qps: 500 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        peak_qps: 1000 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        avg_query_time_ms: 19.8 # Tier 4 | Panel: Database Query Latency | Span: GET /v1/balances
        c_s_squared: 13.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.7 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 0 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: merchant-lookup
        nominal_qps: 3500 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        peak_qps: 6000 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        avg_query_time_ms: 6.4 # Tier 4 | Panel: Database Query Latency | Span: api.merchant_directory.shard_for
        c_s_squared: 13.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.7 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instance: merchants # Architecture definition - Target DB cluster
        writes_per_message: 0 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: auth-token
        nominal_qps: 1000 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        peak_qps: 2000 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        avg_query_time_ms: 2.5 # Tier 4 | Panel: Database Query Latency | Span: POST /v1/auth/token
        c_s_squared: 13.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.7 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instance: merchants # Architecture definition - Target DB cluster
        writes_per_message: 0 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: create-merchant
        nominal_qps: 5 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        peak_qps: 10 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        avg_query_time_ms: 3.5 # Tier 4 | Panel: Database Query Latency | Span: POST /v1/merchants
        c_s_squared: 13.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.7 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instance: merchants # Architecture definition - Target DB cluster
        writes_per_message: 1 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: create-wallet
        nominal_qps: 50 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        peak_qps: 100 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        avg_query_time_ms: 18.2 # Tier 4 | Panel: Database Query Latency | Span: POST /v1/wallets
        c_s_squared: 13.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.7 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 2 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: get-job
        nominal_qps: 500 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        peak_qps: 1000 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        avg_query_time_ms: 13.5 # Tier 4 | Panel: Database Query Latency | Span: GET /v1/jobs/{id}
        c_s_squared: 13.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.7 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 0 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: admin-dlq-replay
        nominal_qps: 1 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        peak_qps: 5 # Tier 3 | Panel: API / Kafka Throughput | Metric: traces_span_metrics_calls_total
        avg_query_time_ms: 5.0 # Tier 4 | Panel: Database Query Latency | Span: POST /v1/admin/dlq/replay
        c_s_squared: 1.0 # Tier 5 | Panel: Latency/Arrival Variance | Metric: variance(duration)/mean(duration)^2
        c_a_squared: 1.0 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stddev(RPS)/mean(RPS)
        db_instance: merchants # Architecture definition - Target DB cluster
        writes_per_message: 1 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
    circuit_breaker:
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate
      min_requests: 90 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      interval_ms: 10000 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      max_fails: 3 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      half_open_probes: 1 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_half_open_failures_total

  # === outbox-relay: polls PG events, produces to Kafka ===
  - name: outbox-relay
    slo:
      target: 0.999 # Product SLO - 99.9% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 2000 # Product SLO - End-to-end publish latency SLA
      target_utilization: 0.65 # Capacity Team - Maximum allowed sustained CPU utilization
    role: producer # Architecture definition - async Kafka producer
    rps_per_core: 474 # Tier 5 | Panel: Compute Saturation Curve | Metric: process_cpu_seconds_total vs outbox_events_published_total
    cores_per_pod: 1 # k8s pod CPU allocation profile
    hpa_target_cpu: 1 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 536870912 # k8s pod Memory limit (512 MiB)
    producer_throughput_rps: 4000 # Tier 4 | Panel: Transactional Outbox: Lag & Buffer Fill | Metric: outbox_events_published_total
    endpoints:
      - name: poll
        nominal_qps: 400 # Tier 4 | Panel: Database Query Latency | Metric: pg_stat_statements
        peak_qps: 1500 # Tier 4 | Panel: Database Query Latency | Metric: pg_stat_statements
        avg_query_time_ms: 4.0 # Tier 4 | Panel: Database Query Latency | Span: outbox.poll
        c_s_squared: 5.6 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 5.0 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 1 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
    topics:
      - jobs # Architecture definition - Producer topic routing
      - notify # Architecture definition - Producer topic routing
      - xshard.shard-a # Architecture definition - Producer topic routing
      - xshard.shard-b # Architecture definition - Producer topic routing
    circuit_breaker:
      max_fails: 3 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      half_open_probes: 1 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_half_open_failures_total
      interval_ms: 10000 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      min_requests: 90 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate
    relay:
      staging_kb: 1024 # Capacity Team - staging buffer budget (1MB)
      max_payload_kb: 64 # Capacity Team - max payload limit (64KB = 65536 bytes)
      buffer_sample_interval_ms: 100 # Capacity Team - AIMD buffer sample frequency
      buffer_max_throttle_level: 3 # Tier 4 | Panel: Transactional Outbox: Lag & Buffer Fill | Metric: kafka_producer_buffer_fill_ratio
      buffer_max_poll_interval_ms: 48 # SHOULD BE DERIVED: Redundant with relayDerived math
      aimd_throttle_frac: 0.8 # Tier 4 | Panel: Transactional Outbox: Lag & Buffer Fill | Metric: kafka_producer_buffer_fill_ratio
      aimd_pause_frac: 1.0 # Tier 4 | Panel: Transactional Outbox: Lag & Buffer Fill | Metric: kafka_producer_buffer_fill_ratio
      aimd_resume_frac: 0.5 # Tier 4 | Panel: Transactional Outbox: Lag & Buffer Fill | Metric: kafka_producer_buffer_fill_ratio

  # === ledger-worker: SERIALIZABLE tx, cross-shard saga ===
  - name: ledger-worker
    slo:
      target: 0.999 # Product SLO - 99.9% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 2000 # Product SLO - End-to-end processing SLA
      target_utilization: 0.65 # Capacity Team - Maximum allowed sustained pool utilization
    role: consumer # Architecture definition - async Kafka consumer
    rps_per_core: 2523 # Tier 5 | Panel: Compute Saturation Curve | Metric: process_cpu_seconds_total vs traces_span_metrics_calls_total
    cores_per_pod: 1 # k8s pod CPU allocation profile
    hpa_target_cpu: 0.9 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 536870912 # k8s pod Memory limit (512 MiB)
    endpoints:
      - name: process-transfer
        nominal_qps: 120 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        peak_qps: 200 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        avg_query_time_ms: 0.8 # Tier 4 | Panel: Database Query Latency | Span: kafka.process_transfer
        c_s_squared: 18.2 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.0 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 7 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: xshard-requested
        nominal_qps: 60 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        peak_qps: 100 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        avg_query_time_ms: 35.7 # Tier 4 | Panel: Database Query Latency | Span: xshard.handle_requested
        c_s_squared: 18.2 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.0 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 7 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: xshard-settled
        nominal_qps: 60 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        peak_qps: 100 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        avg_query_time_ms: 37.0 # Tier 4 | Panel: Database Query Latency | Span: xshard.handle_settled
        c_s_squared: 18.2 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.0 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 8 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: xshard-failed
        nominal_qps: 6 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        peak_qps: 10 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        avg_query_time_ms: 35.7 # Tier 4 | Panel: Database Query Latency | Span: xshard.handle_failed
        c_s_squared: 18.2 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 9.0 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 8 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: dlq-ingest
        nominal_qps: 1 # Ingestion of dead-lettered ledger jobs to global DLQ
        peak_qps: 10 # Bounded by 5% poison pill arrival during incident
        avg_query_time_ms: 2.0 # DB write latency to dlq_messages table
        c_s_squared: 18.2 # Tier 5 | Panel: Latency/Arrival Variance
        c_a_squared: 9.0 # Tier 5 | Panel: Latency/Arrival Variance
        db_instance: merchants # Architecture definition - Global DLQ storage in merchants DB
        writes_per_message: 1 # Tier 4 | Panel: DB Write Spans per Request
      - name: merchant-lookup
        nominal_qps: 120 # Shard resolution lookup in merchants DB
        peak_qps: 200
        avg_query_time_ms: 6.4 # Tier 4 | Panel: Database Query Latency | Span: api.merchant_directory.shard_for
        c_s_squared: 18.2
        c_a_squared: 9.0
        db_instance: merchants
        writes_per_message: 0
    topics:
      - jobs # Architecture definition - Consumer topic subscriptions
      - xshard.shard-a # Architecture definition - Consumer topic subscriptions
      - xshard.shard-b # Architecture definition - Consumer topic subscriptions
    circuit_breaker:
      max_fails: 3 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      half_open_probes: 1 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_half_open_failures_total
      interval_ms: 10000 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      min_requests: 90 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate

  # === webhook-worker: Kafka consumer + HTTPS delivery ===
  - name: webhook-worker
    slo:
      target: 0.999 # Product SLO - 99.9% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 30000 # Product SLO - Max delivery SLA (30s timeout allowance)
      target_utilization: 0.8 # Capacity Team - Maximum allowed sustained pool utilization
    role: consumer # Architecture definition - async Kafka consumer
    rps_per_core: 2159 # Tier 5 | Panel: Compute Saturation Curve | Metric: process_cpu_seconds_total vs traces_span_metrics_calls_total
    cores_per_pod: 1 # k8s pod CPU allocation profile
    hpa_target_cpu: 1 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 536870912 # k8s pod Memory limit (512 MiB)
    endpoints:
      - name: delivery-tracking
        nominal_qps: 120 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        peak_qps: 200 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        avg_query_time_ms: 5.4 # Tier 4 | Panel: Database Query Latency | Span: webhook.handle_message
        c_s_squared: 16.8 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 6.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 2 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: dlq-ingest
        nominal_qps: 1 # Ingestion of dead-lettered webhook deliveries to global DLQ
        peak_qps: 10 # Bounded by 5% poison pill arrival during incident
        avg_query_time_ms: 2.0 # DB write latency to dlq_messages table
        c_s_squared: 16.8 # Tier 5 | Panel: Latency/Arrival Variance
        c_a_squared: 6.9 # Tier 5 | Panel: Latency/Arrival Variance
        db_instance: merchants # Architecture definition - Global DLQ storage in merchants DB
        writes_per_message: 1 # Tier 4 | Panel: DB Write Spans per Request
      - name: merchant-lookup
        nominal_qps: 120 # Webhook URL & Secret lookup in merchants DB
        peak_qps: 200
        avg_query_time_ms: 6.4 # Tier 4 | Panel: Database Query Latency | Span: api.merchant_directory.shard_for
        c_s_squared: 16.8
        c_a_squared: 6.9
        db_instance: merchants
        writes_per_message: 0
    topics:
      - notify # Architecture definition - Consumer topic subscriptions
    http_outbound:
      peak_qps_per_pod: 100 # Tier 4 | Panel: Webhook Concurrency | Metric: bulkhead_inflight_requests
      avg_latency_s: 0.1 # HTTP echo endpoint duration
      host_count: 3 # Capacity Team - Estimated concurrent distinct merchant domains
      per_host_headroom: 16 # Go net/http DefaultMaxIdleConnsPerHost baseline + safety
      idle_conn_timeout_ms: 90000 # Go net/http DefaultIdleConnTimeout (90s)
      response_header_timeout_ms: 10000 # Product Policy - merchant must reply headers in 10s
      tls_handshake_timeout_ms: 5000 # Network Standard - max TLS negotiation time
      expect_continue_timeout_ms: 1000 # Go net/http standard expectation timeout
    circuit_breaker:
      max_fails: 3 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      half_open_probes: 1 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_half_open_failures_total
      interval_ms: 10000 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      min_requests: 90 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate
    webhook:
      delivery_max_attempts: 15 # Product Policy - Merchant webhook delivery absolute retry limit
      delivery_backoff_base_ms: 1000 # Product Policy - Initial exponential backoff delay
      delivery_backoff_cap_ms: 60000 # Product Policy - Max backoff interval (1 minute)
      scheduler_poll_interval_ms: 5000 # Capacity Team - DB polling interval for delayed retries
      scheduler_batch_size: 100 # Tier 4 | Panel: Database Query Latency | Metric: pg_stat_statements
      fast_lane_grace_period_ms: 5000 # Capacity Team - Thread handoff buffer for synchronous delivery
      fast_lane_buffer_size: 100 # Tier 4 | Panel: Webhook Concurrency | Metric: bulkhead_rejections_total
      breaker_eviction_interval_ms: 60000 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state

  # === fraud-worker: consumer + Redis sliding-window velocity ===
  - name: fraud-worker
    slo:
      target: 0.999 # Product SLO - 99.9% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 5000 # Product SLO - End-to-end processing SLA
      target_utilization: 0.7 # Capacity Team - Maximum allowed sustained pool utilization
    role: consumer # Architecture definition - async Kafka consumer
    rps_per_core: 5196 # Tier 5 | Panel: Compute Saturation Curve | Metric: process_cpu_seconds_total vs traces_span_metrics_calls_total
    cores_per_pod: 1 # k8s pod CPU allocation profile
    hpa_target_cpu: 1 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 536870912 # k8s pod Memory limit (512 MiB)
    velocity_threshold: 6000 # Risk/Trust Team - Max transfers allowed per window (for merchant disbursements)
    velocity_window_ms: 60000 # Risk/Trust Team - Transfer velocity window (1 minute)
    endpoints:
      - name: velocity-check
        nominal_qps: 120 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        peak_qps: 200 # Tier 3 | Panel: API / Kafka Throughput | Metric: kafka_consumer_offset
        avg_query_time_ms: 1.0 # Tier 4 | Panel: Database Query Latency | Span: fraud.velocity_eval
        c_s_squared: 10.9 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(duration)/mean(duration)^2
        c_a_squared: 6.5 # Tier 5 | Panel: Latency/Arrival Variance | Metric: stdvar(RPS)/mean(RPS)^2
        db_instances: [shard-a, shard-b] # Architecture definition - Target DB cluster
        writes_per_message: 1 # Tier 4 | Panel: DB Write Spans per Request | Metric: traces_span_metrics_calls_total
      - name: dlq-ingest
        nominal_qps: 1 # Ingestion of dead-lettered fraud checks to global DLQ
        peak_qps: 10 # Bounded by 5% poison pill arrival during incident
        avg_query_time_ms: 2.0 # DB write latency to dlq_messages table
        c_s_squared: 10.9 # Tier 5 | Panel: Latency/Arrival Variance
        c_a_squared: 6.5 # Tier 5 | Panel: Latency/Arrival Variance
        db_instance: merchants # Architecture definition - Global DLQ storage in merchants DB
        writes_per_message: 1 # Tier 4 | Panel: DB Write Spans per Request
      - name: merchant-lookup
        nominal_qps: 120 # Shard resolution lookup in merchants DB
        peak_qps: 200
        avg_query_time_ms: 6.4 # Tier 4 | Panel: Database Query Latency | Span: api.merchant_directory.shard_for
        c_s_squared: 10.9
        c_a_squared: 6.5
        db_instance: merchants
        writes_per_message: 0
      - name: wallet-status-check
        nominal_qps: 120 # Check wallet status on shard prior to freeze
        peak_qps: 200
        avg_query_time_ms: 1.0 # Tier 4 | Panel: Database Query Latency | Span: fraud.wallet_status_check
        c_s_squared: 10.9
        c_a_squared: 6.5
        db_instances: [shard-a, shard-b]
        writes_per_message: 0
    topics:
      - jobs # Architecture definition - Consumer topic subscriptions
    redis:
      merchants: 100000 # Data Analytics - Number of total active merchants to track
      window_buckets: 2 # Risk/Trust Team - Sub-buckets for sliding window precision
      pipeline_window_ms: 10 # Capacity Team - Redis command pipeline buffer
      max_pipeline_batch: 50 # Tier 4 | Panel: Redis Memory & Operations | Metric: redis_commands_total
      eval_sha_ttl_sec: 86400 # Capacity Team - Lua script SHA cache validity (24h)
    circuit_breaker:
      max_fails: 3 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      half_open_probes: 1 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_half_open_failures_total
      interval_ms: 10000 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      min_requests: 90 # Tier 3 | Panel: Open Circuit Breakers | Metric: circuit_breaker_state
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate
