name: GitOps CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  capacity-and-kustomize:
    name: Capacity Engine + Kustomize Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run Capacity Engine
        working-directory: tools/capacity-engine
        run: |
          go run . -input slo-input.yaml -output capacity-output.yaml -render ../..

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Build Dev Overlay
        working-directory: overlays/dev
        run: kustomize build --enable-helm . > /dev/null

      - name: Build Prod Overlay
        working-directory: overlays/prod
        run: kustomize build --enable-helm . > /dev/null
