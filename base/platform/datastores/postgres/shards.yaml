# Global control-plane DB: the `merchants` table + shard routing directory.
# CloudNativePG runs primary + standby; Services: merchants-db-rw/-ro/-r.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: merchants-db
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
    rrq.dev/role: control-plane
spec:
  instances: 3 # 1 Primary + 2 Standbys for high availability and automated failover
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  primaryUpdateStrategy: supervised # Requires explicit supervisor approval for primary switchovers during rollout
  bootstrap:
    initdb:
      database: merchants
      owner: rrq_app # CNPG generates the Secret `merchants-db-app`
  storage:
    size: 10Gi
  resources:
    requests: { cpu: "200m", memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  postgresql:
    parameters:
      max_connections: "239" # Sized for aggregated client connection pool limits across all replicas
      shared_buffers: "512MB" # 50% of container memory limit allocated for PostgreSQL buffer cache
      work_mem: "16MB" # Memory allocation per sorting/hashing operation

---
# Ledger shard A: data for merchants with shard_id='shard-a'.
# Intra-shard transfers post both legs here in one transaction.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shard-a
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
    rrq.dev/role: ledger-shard
    rrq.dev/shard-id: shard-a
spec:
  instances: 3 # 1 Primary + 2 Standbys for high availability and automated failover
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  primaryUpdateStrategy: supervised # Requires explicit supervisor approval for primary switchovers during rollout
  bootstrap:
    initdb:
      database: rrq
      owner: rrq_app # CNPG generates the Secret `shard-a-app`
  storage:
    size: 10Gi
  resources:
    requests: { cpu: "200m", memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  postgresql:
    parameters:
      max_connections: "239" # Sized for aggregated client connection pool limits across all replicas
      shared_buffers: "512MB" # 50% of container memory limit allocated for PostgreSQL buffer cache
      work_mem: "16MB" # Memory allocation per sorting/hashing operation

---
# Ledger shard B: data for merchants with shard_id='shard-b'.
# A shard-a <-> shard-b transfer is the cross-shard (clearing-saga) case.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shard-b
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
    rrq.dev/role: ledger-shard
    rrq.dev/shard-id: shard-b
spec:
  instances: 3 # 1 Primary + 2 Standbys for high availability and automated failover
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  primaryUpdateStrategy: supervised # Requires explicit supervisor approval for primary switchovers during rollout
  bootstrap:
    initdb:
      database: rrq
      owner: rrq_app # CNPG generates the Secret `shard-b-app`
  storage:
    size: 10Gi
  resources:
    requests: { cpu: "200m", memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  postgresql:
    parameters:
      max_connections: "239" # Sized for aggregated client connection pool limits across all replicas
      shared_buffers: "512MB" # 50% of container memory limit allocated for PostgreSQL buffer cache
      work_mem: "16MB" # Memory allocation per sorting/hashing operation
