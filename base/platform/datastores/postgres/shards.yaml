# Global control-plane DB: the `merchants` table + shard routing directory.
# CloudNativePG runs primary + standby; Services: merchants-db-rw/-ro/-r.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: merchants-db
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
    rrq.dev/role: control-plane
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  primaryUpdateStrategy: supervised
  bootstrap:
    initdb:
      database: merchants
      owner: rrq_app # CNPG generates the Secret `merchants-db-app`
  storage:
    size: 10Gi
  resources:
    requests: { cpu: "1", memory: 8Gi }
    limits: { cpu: "2", memory: 8Gi }
  postgresql:
    parameters:
      max_connections: "239"
      shared_buffers: "512MB" #Industry standard: 25% of your RAM
      work_mem: "16Mi"

---
# Ledger shard A: data for merchants with shard_id='shard-a'.
# Intra-shard transfers post both legs here in one transaction.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shard-a
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
    rrq.dev/role: ledger-shard
    rrq.dev/shard-id: shard-a
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  primaryUpdateStrategy: supervised
  bootstrap:
    initdb:
      database: rrq
      owner: rrq_app # CNPG generates the Secret `shard-a-app`
  storage:
    size: 10Gi
  resources:
    requests: { cpu: "1", memory: 8Gi }
    limits: { cpu: "2", memory: 8Gi }
  postgresql:
    parameters:
      max_connections: "239"
      shared_buffers: "512MB" #Industry standard: 25% of your RAM
      work_mem: "16Mi"

---
# Ledger shard B: data for merchants with shard_id='shard-b'.
# A shard-a <-> shard-b transfer is the cross-shard (clearing-saga) case.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shard-b
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
    rrq.dev/role: ledger-shard
    rrq.dev/shard-id: shard-b
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  primaryUpdateStrategy: supervised
  bootstrap:
    initdb:
      database: rrq
      owner: rrq_app # CNPG generates the Secret `shard-b-app`
  storage:
    size: 10Gi
  resources:
    requests: { cpu: "1", memory: 8Gi }
    limits: { cpu: "2", memory: 8Gi }
  postgresql:
    parameters:
      max_connections: "239"
      shared_buffers: "512MB" #Industry standard: 25% of your RAM
      work_mem: "16Mi"
