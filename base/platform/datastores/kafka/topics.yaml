# `jobs`: job.requested (ledger + fraud workers). `notify`: transfer.* keyed by
# merchant_id for per-merchant order. xshard.* for cross-shard saga orchestration.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: jobs
  namespace: rrq
  labels:
    strimzi.io/cluster: rrq
spec:
  partitions: 5
  replicas: 2
  config:
    retention.ms: "86400000" # 1 day
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: notify
  namespace: rrq
  labels:
    strimzi.io/cluster: rrq
spec:
  partitions: 14
  replicas: 2
  config:
    retention.ms: "86400000" # 1 day
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: xshard.shard-a
  namespace: rrq
  labels:
    strimzi.io/cluster: rrq
spec:
  partitions: 8
  replicas: 2
  config:
    retention.ms: "86400000" # 1 day
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: xshard.shard-b
  namespace: rrq
  labels:
    strimzi.io/cluster: rrq
spec:
  partitions: 8
  replicas: 2
  config:
    retention.ms: "86400000" # 1 day
