architecture: replication # Master-replica topology managed with Redis Sentinel for automated failover
fullnameOverride: "fraud-redis"
auth:
  enabled: true
  existingSecret: redis-secret
  existingSecretPasswordKey: redis-password
sentinel:
  enabled: true # Sentinel quorum monitors and orchestrates master failover
master:
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
replica:
  replicaCount: 2 # 2 read replicas for read-scaling and standby promotion
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
commonConfiguration: |-
  appendonly no # In-memory caching mode with disk persistence disabled for latency
  save ""
