apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.0
    releaseName: cnpg
    namespace: cnpg-system
    includeCRDs: true

  - name: strimzi-kafka-operator
    repo: https://strimzi.io/charts/
    version: 1.1.0
    releaseName: strimzi
    namespace: strimzi-system
    includeCRDs: true
    valuesInline:
      watchAnyNamespace: true

  - name: gateway-helm
    repo: oci://registry-1.docker.io/envoyproxy
    version: v1.8.2
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    includeCRDs: true

  - name: keda
    repo: https://kedacore.github.io/charts
    version: 2.20.1
    releaseName: keda
    namespace: keda
    includeCRDs: true

  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.0
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    valuesInline:
      crds:
        enabled: true
      extraArgs:
        - --enable-gateway-api

  - name: eck-operator
    repo: https://helm.elastic.co
    version: 3.4.1
    releaseName: eck-operator
    namespace: elastic-system
    includeCRDs: true
    valuesInline:
      installCRDs: true
      logLevel: info

  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 87.17.0
    releaseName: kube-prometheus-stack
    namespace: observability
    includeCRDs: true
    valuesInline:
      grafana:
        grafana.ini:
          auth.anonymous:
            enabled: false
            org_role: Viewer
          auth.basic:
            enabled: true
          auth.disable_login_form: "false"
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        env:
          JAEGER_AGENT_PORT: ""
      prometheus:
        prometheusSpec:
          replicas: 2
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 20Gi
      prometheusOperator:
        tls:
          enabled: false
        admissionWebhooks:
          enabled: false
      alertmanager:
        alertmanagerSpec:
          alertmanagerConfigSelector:
            matchLabels:
              app.kubernetes.io/part-of: rrq

  - name: opentelemetry-operator
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.120.0
    releaseName: opentelemetry-operator
    includeCRDs: true
    namespace: observability
    valuesInline:
      admissionWebhooks:
        certManager:
          enabled: true
      manager:
        extraArgs:
          - --enable-go-instrumentation=true
          repository: otel/opentelemetry-collector-contrib
