apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier2-user-journeys
  namespace: observability
  labels:
    grafana_dashboard: '1'
data:
  rrq-tier2-user-journeys.json: |-
    {
      "title": "Tier 2: User Journeys & Flows",
      "uid": "tier2-user-journeys",
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "rrq",
        "reorganized"
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Saga Unresolved Count",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "saga_unresolved_count",
              "legendFormat": "Stuck Sagas"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Dead Letter Queue (DLQ) Churn",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(dlq_ingestion_rate[1m])",
              "legendFormat": "Ingested"
            },
            {
              "expr": "rate(admin_dlq_replayed_total[1m])",
              "legendFormat": "Replayed"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Webhook Delivery vs Rejections",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "bulkhead_in_flight",
              "legendFormat": "Inflight"
            },
            {
              "expr": "rate(bulkhead_rejections_total[1m])",
              "legendFormat": "Rejected"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Idempotency Conflicts",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "rate(idempotency_conflicts_total[1m])",
              "legendFormat": "Conflicts"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "DLQ Inflow Quality",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "sum(rate(dlq_infrastructure_flood_total[5m])) by (service_name)",
              "legendFormat": "Infra Flood ({{service_name}})"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Ledger Imbalance",
          "description": "ledger_imbalance is a gauge (not a counter); it carries the absolute imbalance sum, not a delta. Track for absolute drift, not rate.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "ledger_imbalance",
              "legendFormat": "Imbalance"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Idempotency Replay",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "sum(rate(idempotency_hits_total[5m])) by (shard)",
              "legendFormat": "Hits ({{shard}})"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        }
      ]
    }
