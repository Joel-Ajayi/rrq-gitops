apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier4-middleware-data
  namespace: observability
  labels:
    grafana_dashboard: '1'
data:
  rrq-tier4-middleware-data.json: "{\n  \"title\": \"Tier 4: Middleware & Data (USE)\",\n  \"uid\": \"tier4-middleware-data\",\n  \"version\": 3,\n  \"refresh\": \"10s\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"tags\": [\n    \"rrq\",\n    \"reorganized\"\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"db_pool\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"prometheus\"\n        },\n        \"query\": \"label_values(pg_pool_acquired_conns, db_pool)\",\n        \"refresh\": 1,\n        \"includeAll\": true,\n        \"multi\": true\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Postgres Buffer Cache Hit Ratio\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n     \
    \     \"min\": 0,\n          \"max\": 100\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m]))) * 100\",\n          \"legendFormat\": \"Hit Ratio (%)\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Postgres Dead Tuples (Table Bloat)\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(pg_stat_user_tables_n_dead_tup) by (relname)\",\n          \"legendFormat\": \"{{relname}}\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\":\
    \ \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Postgres Database Query Latency (Auto-OTel Spans)\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(traces_span_metrics_duration_seconds_sum{db_system_name=\\\"postgresql\\\"}[1m])) by (span_name) / sum(rate(traces_span_metrics_duration_seconds_count{db_system_name=\\\"postgresql\\\"}[1m])) by (span_name)\",\n          \"legendFormat\": \"{{span_name}} (Avg Latency)\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.99, sum(rate(traces_span_metrics_duration_seconds_bucket{db_system_name=\\\"postgresql\\\"}[1m])) by (le, span_name))\",\n          \"legendFormat\": \"{{span_name}} (P99 Latency)\"\n        }\n      ],\n      \"datasource\": {\n        \"type\"\
    : \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Postgres Connection Pool Utilization\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(pg_pool_acquired_conns{db_pool=~\\\"$db_pool\\\"}) by (exported_job, db_pool)\",\n          \"legendFormat\": \"Acquired: {{exported_job}} ({{db_pool}})\"\n        },\n        {\n          \"expr\": \"sum(pg_pool_idle_conns{db_pool=~\\\"$db_pool\\\"}) by (exported_job, db_pool)\",\n          \"legendFormat\": \"Idle: {{exported_job}} ({{db_pool}})\"\n        },\n        {\n          \"expr\": \"sum(rate(pg_pool_empty_acquire_count_total{db_pool=~\\\"$db_pool\\\"}[1m])) by (exported_job, db_pool)\",\n          \"legendFormat\": \"Waits/s: {{exported_job}}\
    \ ({{db_pool}})\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Kafka Consumer Group Lag (OTel Collector)\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(kafka_consumer_group_lag_ratio) by (group, topic)\",\n          \"legendFormat\": \"Lag: {{group}} ({{topic}})\"\n        },\n        {\n          \"expr\": \"sum(kafka_consumer_group_lag_sum_ratio) by (group)\",\n          \"legendFormat\": \"Total Lag: {{group}}\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Kafka Consumer\
    \ Throughput & Active Members\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ops\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(kafka_consumer_group_offset_sum_ratio[1m])) by (group, topic)\",\n          \"legendFormat\": \"Consume RPS: {{group}} ({{topic}})\"\n        },\n        {\n          \"expr\": \"sum(kafka_consumer_group_members) by (group)\",\n          \"legendFormat\": \"Members: {{group}}\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Kafka Broker Health & Partition Balance\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 24\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\"\
    : \"short\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(kafka_brokers)\",\n          \"legendFormat\": \"Brokers\"\n        },\n        {\n          \"expr\": \"sum(kafka_topic_partitions) by (topic)\",\n          \"legendFormat\": \"Partitions: {{topic}}\"\n        },\n        {\n          \"expr\": \"sum(kafka_cluster_partition_underreplicated)\",\n          \"legendFormat\": \"Under-Replicated Partitions\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Transactional Outbox: Lag & Buffer Fill\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 24\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"max(outbox_lag_seconds) by (shard)\",\n         \
    \ \"legendFormat\": \"Outbox Lag (s): {{shard}}\"\n        },\n        {\n          \"expr\": \"max(kafka_producer_buffer_fill_ratio) by (shard)\",\n          \"legendFormat\": \"Producer Buffer Fill: {{shard}}\"\n        },\n        {\n          \"expr\": \"sum(rate(outbox_events_published_total[1m])) by (shard)\",\n          \"legendFormat\": \"Published RPS: {{shard}}\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Redis Memory Fragmentation & Evictions\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 32\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"max(redis_memory_fragmentation_ratio) by (pod)\",\n          \"legendFormat\": \"Frag Ratio: {{pod}}\"\n        },\n    \
    \    {\n          \"expr\": \"sum(rate(redis_evicted_keys_total[1m])) by (pod)\",\n          \"legendFormat\": \"Evictions/s: {{pod}}\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Redis Connected Clients & Operations\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 32\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ops\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(redis_connected_clients) by (pod)\",\n          \"legendFormat\": \"Clients: {{pod}}\"\n        },\n        {\n          \"expr\": \"sum(rate(redis_commands_total[1m])) by (pod)\",\n          \"legendFormat\": \"Commands/s: {{pod}}\"\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      }\n \
    \   }\n  ]\n}"
