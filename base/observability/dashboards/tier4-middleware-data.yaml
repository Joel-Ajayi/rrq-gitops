apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier4-middleware-data
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-tier4-middleware-data.json: |-
    {
      "title": "Tier 4: Middleware & Data (USE)",
      "uid": "tier4-middleware-data",
      "version": 2,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "rrq",
        "reorganized"
      ],
      "templating": {
        "list": [
          {
            "name": "shard",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(pg_pool_acquired_conns, shard)",
            "refresh": 1,
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Postgres Buffer Cache Hit Ratio",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m]))) * 100",
              "legendFormat": "Hit Ratio (%)"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Postgres Dead Tuples (Table Bloat)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(pg_stat_user_tables_n_dead_tup) by (relname)",
              "legendFormat": "{{relname}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Postgres Database Query Latency (Auto-OTel Spans)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(traces_span_metrics_duration_seconds_bucket{db_system_name=\"postgresql\"}[5m])) by (le, span_name))",
              "legendFormat": "{{span_name}} P99"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(traces_span_metrics_duration_seconds_bucket{db_system_name=\"postgresql\"}[5m])) by (le, span_name))",
              "legendFormat": "{{span_name}} P50"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Postgres Connection Pool Utilization",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(pg_pool_acquired_conns) by (service, db_pool, shard)",
              "legendFormat": "Acquired: {{service}} ({{db_pool}} / {{shard}})"
            },
            {
              "expr": "sum(pg_pool_idle_conns) by (service, db_pool, shard)",
              "legendFormat": "Idle: {{service}} ({{db_pool}} / {{shard}})"
            },
            {
              "expr": "sum(rate(pg_pool_empty_acquire_count_total[1m])) by (service, db_pool)",
              "legendFormat": "Waits/s: {{service}} ({{db_pool}})"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Kafka Consumer Group Lag (OTel Collector)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "sum(kafka_consumer_group_lag_ratio) by (group, topic)",
              "legendFormat": "Lag: {{group}} ({{topic}})"
            },
            {
              "expr": "sum(kafka_consumer_group_lag_sum_ratio) by (group)",
              "legendFormat": "Total Lag: {{group}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Kafka Consumer Throughput & Active Members",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "sum(rate(kafka_consumer_group_offset_sum_ratio[1m])) by (group, topic)",
              "legendFormat": "Consume RPS: {{group}} ({{topic}})"
            },
            {
              "expr": "sum(kafka_consumer_group_members) by (group)",
              "legendFormat": "Members: {{group}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Kafka Broker Health & Partition Balance",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "sum(kafka_brokers)",
              "legendFormat": "Brokers"
            },
            {
              "expr": "sum(kafka_topic_partitions) by (topic)",
              "legendFormat": "Partitions: {{topic}}"
            },
            {
              "expr": "sum(kafka_cluster_partition_underreplicated)",
              "legendFormat": "Under-Replicated Partitions"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Transactional Outbox: Lag & Buffer Fill",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "expr": "max(outbox_lag_seconds) by (shard)",
              "legendFormat": "Outbox Lag (s): {{shard}}"
            },
            {
              "expr": "max(kafka_producer_buffer_fill_ratio) by (shard)",
              "legendFormat": "Producer Buffer Fill: {{shard}}"
            },
            {
              "expr": "sum(rate(outbox_events_published_total[1m])) by (shard)",
              "legendFormat": "Published RPS: {{shard}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Redis Memory Fragmentation & Evictions",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            {
              "expr": "max(redis_memory_fragmentation_ratio) by (pod)",
              "legendFormat": "Frag Ratio: {{pod}}"
            },
            {
              "expr": "sum(rate(redis_evicted_keys_total[1m])) by (pod)",
              "legendFormat": "Evictions/s: {{pod}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Redis Connected Clients & Operations",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            {
              "expr": "sum(redis_connected_clients) by (pod)",
              "legendFormat": "Clients: {{pod}}"
            },
            {
              "expr": "sum(rate(redis_commands_total[1m])) by (pod)",
              "legendFormat": "Commands/s: {{pod}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        }
      ]
    }
