apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier1-business-slos
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-tier1-business-slos.json: |-
    {
      "title": "Tier 1: Business & SLOs",
      "uid": "tier1-business-slos",
      "version": 2,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "rrq",
        "reorganized"
      ],
      "templating": {
        "list": [
          {
            "name": "trace_id",
            "type": "textbox",
            "label": "Trace ID",
            "description": "Paste a 32-hex-char trace_id to open the per-transfer trace in Jaeger. Find it in Kibana: filter by event:transfer.completed and job_id:<job_id>."
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Total Transfers Processed",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(business_transfers_total)",
              "expr": "sum(business_transfers_total) or vector(0)",
              "legendFormat": "Total"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "stat",
          "title": "Successful Transfers",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(business_transfers_total{status=\"success\"})",
              "expr": "sum(business_transfers_total{status=\"success\"}) or vector(0)",
              "legendFormat": "Success"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "stat",
          "title": "Failed / Declined Transfers",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(business_transfers_total{status=\"failed\"})",
              "expr": "sum(business_transfers_total{status=\"failed\"}) or vector(0)",
              "legendFormat": "Failed"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "stat",
          "title": "Cumulative GTV",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(business_gtv_total)",
              "expr": "sum(business_gtv_total) or vector(0)",
              "legendFormat": "GTV (NGN minor)"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Transfer Throughput by Status & Shard Type",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(business_transfers_total[1m])) by (status, shard_type)",
              "legendFormat": "{{status}} ({{shard_type}})"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Transfer Success Rate (TSR)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "(sum(rate(business_transfers_total{status=\"success\"}[1m])) / sum(rate(business_transfers_total[1m]))) * 100",
              "legendFormat": "TSR (%)"
            },
            {
              "expr": "sum(rate(traces_span_metrics_calls_total{span_name=\"api.transfer_submitter.submit\", status_code=\"STATUS_CODE_OK\"}[1m])) / sum(rate(traces_span_metrics_calls_total{span_name=\"api.transfer_submitter.submit\"}[1m])) * 100",
              "expr": "((sum(rate(traces_span_metrics_calls_total{span_name=~\"POST /v1/transfers|api.transfer_submitter.submit\"}[1m])) - sum(rate(traces_span_metrics_calls_total{span_name=~\"POST /v1/transfers|api.transfer_submitter.submit\", status_code=\"STATUS_CODE_ERROR\"}[1m])) or sum(rate(traces_span_metrics_calls_total{span_name=~\"POST /v1/transfers|api.transfer_submitter.submit\"}[1m]))) / sum(rate(traces_span_metrics_calls_total{span_name=~\"POST /v1/transfers|api.transfer_submitter.submit\"}[1m]))) * 100",
              "legendFormat": "API Submit Success (%)"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Gross Transaction Value (GTV Rate)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum(rate(business_gtv_total[1m])) by (currency)",
              "legendFormat": "GTV Rate ({{currency}}/s)"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Decline Reasons Breakdown",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(business_declines_total[1m])) by (reason)",
              "legendFormat": "Decline: {{reason}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Fraud / Velocity Rejections",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(velocity_limit_exceeded_total[1m])) by (limit_type)",
              "legendFormat": "Limit: {{limit_type}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Deposit Operations & Inflow",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum(rate(business_deposits_total[1m])) by (status, currency)",
              "legendFormat": "Count: {{status}} ({{currency}})"
            },
            {
              "expr": "sum(rate(business_deposits_amount_total[1m])) by (currency)",
              "legendFormat": "Amount: {{currency}}/s"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Wallet Onboarding Rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum(rate(business_wallets_created_total[1m])) by (currency)",
              "legendFormat": "Wallets: {{currency}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Cross-Shard Saga Throughput & Latency",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(business_saga_initiated_total[1m]))",
              "legendFormat": "Initiated/s"
            },
            {
              "expr": "sum(rate(business_saga_completed_total[1m]))",
              "legendFormat": "Completed/s"
            },
            {
              "expr": "histogram_quantile(0.5, sum(rate(business_saga_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p50 Latency (s)"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(business_saga_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p99 Latency (s)"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Refunds & Disputes Activity",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(business_refunds_total[1m])) by (currency)",
              "legendFormat": "Refunds ({{currency}})"
            },
            {
              "expr": "sum(rate(business_disputes_total[1m])) by (dispute_status)",
              "legendFormat": "Disputes ({{dispute_status}})"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Reconciliation Discrepancies",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(recon_discrepancies_total[1m])) by (shard)",
              "legendFormat": "Discrepancy RPS ({{shard}})"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "text",
          "title": "Per-Transfer Trace Lookup",
          "description": "Paste a trace_id (32 hex chars) below to open the per-transfer trace in Jaeger. Find the trace_id from a canonical log in Kibana: filter by event:transfer.completed and job_id:<job_id>.",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 44 },
          "options": {
            "mode": "markdown",
            "content": "## Per-Transfer Trace Lookup\n\n**Trace ID:**  ${trace_id}\n\n[Open in Jaeger](https://traces.127.0.0.1.nip.io/trace/${trace_id})\n\n> The Jaeger URL uses the local dev host (traces.127.0.0.1.nip.io). For prod, replace with https://traces.rrq.yotstack.tech/trace/${trace_id}.\n> A trace_id propagates through HTTP request → outbox event → Kafka header → consumer ctx → saga events → webhook delivery, all in one trace."
          }
        }
      ]
    }
