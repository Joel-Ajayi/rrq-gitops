apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier1-business-slos
  namespace: observability
  labels:
    grafana_dashboard: '1'
data:
  rrq-tier1-business-slos.json: |-
    {
      "title": "Tier 1: Business & SLOs",
      "uid": "tier1-business-slos",
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "rrq",
        "reorganized"
      ],
      "templating": {
        "list": [
          {
            "name": "trace_id",
            "type": "textbox",
            "label": "Trace ID",
            "description": "Paste a 32-hex-char trace_id to open the per-transfer trace in Jaeger. Find it in Kibana: filter by event:transfer.completed and job_id:<job_id>."
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Total Processed Transfers",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(business_transfers_total[1m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Fraud / Velocity Rejections",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(velocity_limit_exceeded_total[1m])",
              "legendFormat": "Rejections/sec"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Transfer Success Rate",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(rate(traces_span_metrics_calls_total{span_name=\"api.transfer_submitter.submit\", status_code=\"STATUS_CODE_OK\"}[1m])) / sum(rate(traces_span_metrics_calls_total{span_name=\"api.transfer_submitter.submit\"}[1m]))",
              "legendFormat": "Success Ratio"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Active Merchants (Proxy)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(rate(traces_span_metrics_calls_total{span_name=\"api.merchant_directory.shard_for\"}[1m]))",
              "legendFormat": "Lookup RPS"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Gross Transaction Value (GTV)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum(rate(business_gtv_total[1m])) by (currency)",
              "legendFormat": "GTV ({{currency}})"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Decline Reasons",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "sum(rate(business_declines_total[5m])) by (reason)",
              "legendFormat": "{{reason}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Deposit Activity",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "sum(rate(business_deposits_total[5m])) by (status)",
              "legendFormat": "Count ({{status}})"
            },
            {
              "expr": "sum(rate(business_deposits_amount_total[5m])) by (currency)",
              "legendFormat": "Amount ({{currency}})"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Refund & Dispute Activity",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "expr": "sum(rate(business_refunds_total[5m])) by (currency)",
              "legendFormat": "Refunds ({{currency}})"
            },
            {
              "expr": "sum(rate(business_disputes_total[5m])) by (dispute_status)",
              "legendFormat": "Disputes ({{dispute_status}})"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Wallet Onboarding",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            {
              "expr": "sum(rate(business_wallets_created_total[5m])) by (currency)",
              "legendFormat": "{{currency}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Cross-Shard Saga Activity",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            {
              "expr": "sum(rate(business_saga_initiated_total[5m]))",
              "legendFormat": "Initiated/s"
            },
            {
              "expr": "sum(rate(business_saga_completed_total[5m]))",
              "legendFormat": "Completed/s"
            },
            {
              "expr": "histogram_quantile(0.5, sum(rate(business_saga_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50 (s)"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(business_saga_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99 (s)"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "type": "text",
          "title": "Per-Transfer Trace Lookup",
          "description": "A7: paste a trace_id (32 hex chars) below to open the per-transfer trace in Jaeger. Find the trace_id from a canonical log in Kibana: filter by event:transfer.completed and job_id:<job_id>.",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 40 },
          "options": {
            "mode": "markdown",
            "content": "## Per-Transfer Trace Lookup\n\n**Trace ID:**  ${trace_id}\n\n[Open in Jaeger](https://traces.127.0.0.1.nip.io/trace/${trace_id})\n\n> The Jaeger URL uses the local dev host (traces.127.0.0.1.nip.io). For prod, replace with https://traces.rrq.yotstack.tech/trace/${trace_id}.\n> A trace_id propagates through HTTP request → outbox event → Kafka header → consumer ctx → saga events → webhook delivery, all in one trace."
          }
        }
      ]
    }
