apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier1-business-slos
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-tier1-business-slos.json: |-
    {
      "title": "Tier 1: Business & SLOs",
      "uid": "tier1-business-slos",
      "version": 3,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "rrq",
        "reorganized"
      ],
      "templating": {
        "list": [
          {
            "name": "trace_id",
            "type": "textbox",
            "label": "Trace ID",
            "description": "Paste a 32-hex-char trace_id to open the per-transfer trace in Jaeger."
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Total Transfers (API Ingress)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum(traces_span_metrics_calls_total{span_name=\"POST /v1/transfers\"}) or vector(0)",
              "legendFormat": "Total API"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "API Ingress Errors (5xx)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum(traces_span_metrics_calls_total{span_name=\"POST /v1/transfers\", status_code=\"STATUS_CODE_ERROR\"}) or vector(0)",
              "legendFormat": "HTTP 5xx"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Settled Transfers (Async)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum(business_transfers_total{status=\"success\"}) or vector(0)",
              "legendFormat": "Settled"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Business Declined Transfers",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum(business_transfers_total{status=\"failed\"}) or sum(business_declines_total) or vector(0)",
              "legendFormat": "Declined"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Unresolved Sagas",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum(saga_unresolved_count) or vector(0)",
              "legendFormat": "In-Flight"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Cumulative GTV",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum(business_gtv_total) or vector(0)",
              "legendFormat": "GTV (NGN minor)"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Transfer Throughput by Status & Shard Type",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(traces_span_metrics_calls_total{span_name=\"POST /v1/transfers\"}[1m]))",
              "legendFormat": "API: /v1/transfers"
            },
            {
              "expr": "sum(rate(business_transfers_total[1m])) by (status, shard_type)",
              "legendFormat": "{{status}} ({{shard_type}})"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Transfer Success Rate (TSR)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "expr": "((sum(rate(traces_span_metrics_calls_total{span_name=\"POST /v1/transfers\"}[1m])) - sum(rate(traces_span_metrics_calls_total{span_name=\"POST /v1/transfers\", status_code=\"STATUS_CODE_ERROR\"}[1m])) or sum(rate(traces_span_metrics_calls_total{span_name=\"POST /v1/transfers\"}[1m]))) / sum(rate(traces_span_metrics_calls_total{span_name=\"POST /v1/transfers\"}[1m]))) * 100",
              "legendFormat": "API TSR (%)"
            },
            {
              "expr": "(sum(rate(business_transfers_total{status=\"success\"}[1m])) / sum(rate(business_transfers_total[1m]))) * 100",
              "legendFormat": "Async TSR (%)"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Gross Transaction Value (GTV Rate)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(business_gtv_total[1m])) by (currency)",
              "legendFormat": "GTV Rate ({{currency}}/s)"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Decline Reasons Breakdown",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(business_declines_total[1m])) by (reason)",
              "legendFormat": "Decline: {{reason}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Fraud / Velocity Rejections",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(velocity_limit_exceeded_total[1m])) by (limit_type)",
              "legendFormat": "Limit: {{limit_type}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Deposit Operations & Inflow",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(business_deposits_total[1m])) by (status, currency)",
              "legendFormat": "Count: {{status}} ({{currency}})"
            },
            {
              "expr": "sum(rate(business_deposits_amount_total[1m])) by (currency)",
              "legendFormat": "Amount: {{currency}}/s"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Wallet Onboarding Rate",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(business_wallets_created_total[1m])) by (currency)",
              "legendFormat": "Wallets: {{currency}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Cross-Shard Saga Throughput & Latency",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(business_saga_initiated_total[1m]))",
              "legendFormat": "Initiated/s"
            },
            {
              "expr": "sum(rate(business_saga_completed_total[1m]))",
              "legendFormat": "Completed/s"
            },
            {
              "expr": "histogram_quantile(0.5, sum(rate(business_saga_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p50 Latency (s)"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(business_saga_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p99 Latency (s)"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Refunds & Disputes Activity",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 36
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(business_refunds_total[1m])) by (currency)",
              "legendFormat": "Refunds ({{currency}})"
            },
            {
              "expr": "sum(rate(business_disputes_total[1m])) by (dispute_status)",
              "legendFormat": "Disputes ({{dispute_status}})"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Reconciliation Discrepancies",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 36
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(recon_discrepancies_total[1m])) by (shard)",
              "legendFormat": "Discrepancy RPS ({{shard}})"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "text",
          "title": "Per-Transfer Trace Lookup",
          "description": "Paste a trace_id (32 hex chars) below to open the per-transfer trace in Jaeger.",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 44
          },
          "options": {
            "mode": "markdown",
            "content": "## Per-Transfer Trace Lookup\n\n**Trace ID:**  ${trace_id}\n\n[Open in Jaeger](https://traces.127.0.0.1.nip.io/trace/${trace_id})\n\n> The Jaeger URL uses the local dev host (traces.127.0.0.1.nip.io).\n> A trace_id propagates through HTTP request \u2192 outbox event \u2192 Kafka header \u2192 consumer ctx \u2192 saga events \u2192 webhook delivery, all in one trace."
          }
        }
      ]
    }
