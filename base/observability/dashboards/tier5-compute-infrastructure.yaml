apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier5-compute-infrastructure
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  rrq-tier5-compute-infrastructure.json: |-
    {
      "title": "Tier 5: Compute Infrastructure (USE)",
      "uid": "tier5-compute-infrastructure",
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "rrq",
        "reorganized"
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Pod Restarts (CrashLoopBackOff)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum(rate(kube_pod_container_status_restarts_total{namespace=\"rrq\"}[5m])) by (pod)",
              "legendFormat": "{{pod}} Restarts/sec"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "PVC Saturation",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [
            {
              "expr": "max(kubelet_volume_stats_used_bytes / on(namespace, persistentvolumeclaim) kubelet_volume_stats_capacity_bytes) by (namespace, persistentvolumeclaim)",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Node CPU/Memory Pressure",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "kube_node_status_condition{condition=~\"MemoryPressure|DiskPressure\", status=\"true\"}",
              "legendFormat": "{{node}} {{condition}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Network Transmit Errors",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum(rate(node_network_transmit_errs_total[5m])) by (instance, device)",
              "legendFormat": "{{instance}} [{{device}}]"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Compute Saturation Curve",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(rate(process_cpu_seconds_total[1m])) by (job)",
              "legendFormat": "CPU ({{job}})"
            },
            {
              "expr": "sum(rate(traces_span_metrics_calls_total[1m])) by (service_name)",
              "legendFormat": "RPS ({{service_name}})"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Latency/Arrival Variance (C_s^2 / C_a^2)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "stdvar(rate(traces_span_metrics_duration_seconds_sum[5m])) by (service_name) / (avg(rate(traces_span_metrics_duration_seconds_sum[5m])) by (service_name) ^ 2)",
              "legendFormat": "C_s^2 ({{service_name}})"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        }
      ]
    }
