apiVersion: v1
kind: ConfigMap
metadata:
  name: rrq-tier5-compute-infrastructure
  namespace: observability
  labels:
    grafana_dashboard: '1'
data:
  rrq-tier5-compute-infrastructure.json: |-
    {
      "title": "Tier 5: Compute Infrastructure (USE)",
      "uid": "tier5-compute-infrastructure",
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "rrq",
        "reorganized"
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Pod Restarts (CrashLoopBackOff)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(kube_pod_container_status_restarts_total[5m])",
              "legendFormat": "{{pod}} Restarts/sec"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "PVC Saturation",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes",
              "legendFormat": "{{persistentvolumeclaim}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Node CPU/Memory Pressure",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "kube_node_status_condition{condition=~\"MemoryPressure|DiskPressure\"}",
              "legendFormat": "{{node}} {{condition}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Network Transmit Errors",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "rate(node_network_transmit_errs_total[5m])",
              "legendFormat": "{{device}} Errors/sec"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Compute Saturation Curve",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total[1m])",
              "legendFormat": "CPU (cores)"
            },
            {
              "expr": "rate(traces_span_metrics_calls_total[1m])",
              "legendFormat": "RPS"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Latency/Arrival Variance (C_s^2 / C_a^2)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "expr": "variance(traces_span_metrics_duration_seconds) / (mean(traces_span_metrics_duration_seconds)^2)",
              "legendFormat": "C_s^2 Variance"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        }
      ]
    }
