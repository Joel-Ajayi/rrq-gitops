apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cluster-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "cluster.127.0.0.1.nip.io"
    - "cluster.rrq.yotstack.tech"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: portainer
          namespace: portainer
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "metrics.127.0.0.1.nip.io"
    - "metrics.rrq.yotstack.tech"
  rules:
    # Tier 1: Business & SLOs Overview
    - matches:
        - path:
            type: Exact
            value: /executive
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/tier1-business-slos/tier-1-business-slos
            statusCode: 302
    # Tier 2: User Journeys & Flows
    - matches:
        - path:
            type: Exact
            value: /journeys
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/tier2-user-journeys/tier-2-user-journeys-flows
            statusCode: 302
    # Tier 3: Microservice Health (RED Method)
    - matches:
        - path:
            type: PathPrefix
            value: /services
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/tier3-service-health/tier-3-service-health-red
            statusCode: 302
    # Tier 4: Middleware & Data Stores (USE Method)
    - matches:
        - path:
            type: Exact
            value: /middleware
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/tier4-middleware-data/tier-4-middleware-data
            statusCode: 302
    # Tier 5: Compute & Platform Infrastructure (USE Method)
    - matches:
        - path:
            type: Exact
            value: /infrastructure
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/tier5-compute-infrastructure/tier-5-compute-infrastructure
            statusCode: 302
    # Default Grafana Dashboard UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          namespace: observability
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logs-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "logs.127.0.0.1.nip.io"
    - "logs.rrq.yotstack.tech"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kibana-kb-http
          namespace: observability
          port: 5601
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traces-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "traces.127.0.0.1.nip.io"
    - "traces.rrq.yotstack.tech"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jaeger-collector
          namespace: observability
          port: 16686
---
# Reference Grant authorizing 'rrq' HTTPRoutes to connect to Portainer
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-rrq-route-to-portainer
  namespace: portainer
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: rrq
  to:
    - group: ""
      kind: Service
      name: portainer
---
# Reference Grant authorizing 'rrq' HTTPRoutes to connect to 'observability' backend services
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-rrq-route-to-observability
  namespace: observability
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: rrq
  to:
    - group: ""
      kind: Service
      name: kube-prometheus-stack-grafana
    - group: ""
      kind: Service
      name: kube-prometheus-stack-prometheus
    - group: ""
      kind: Service
      name: kibana-kb-http
    - group: ""
      kind: Service
      name: jaeger-collector
