apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    release: kube-prometheus-stack #Allow to be discovered by Prometheus Operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-collector
      operator.opentelemetry.io/collector-service-type: headless # Match the headless service so that we can scrape all pods in the deployment once
  endpoints:
    - port: prometheus
      interval: 15s
      path: /metrics
