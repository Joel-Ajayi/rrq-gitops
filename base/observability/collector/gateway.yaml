apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: gateway
  namespace: observability
spec:
  image: otel/opentelemetry-collector-contrib:0.156.0
  mode: deployment
  serviceAccount: gateway
  replicas: 1
  env:
    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-es-elastic-user
          key: elastic
  args:
    feature-gates: "connector.spanmetrics.useSecondAsDefaultMetricsUnit"
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      kafka_metrics:
        brokers: "kafka-cluster-kafka-bootstrap.rrq.svc.cluster.local:9092"
        protocol_version: 2.0.0
        collection_interval: 10s
        scrapers:
          - topics
          - consumers
          - brokers
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 1024
        spike_limit_mib: 256
      filter/health_checks:
        error_mode: ignore
        traces:
          span:
            - 'attributes["url.path"] == "/health"'
            - 'attributes["url.path"] == "/ready"'
            - 'attributes["http.target"] == "/health"'
            - 'attributes["http.target"] == "/ready"'
            - 'attributes["http.route"] == "/health"'
            - 'attributes["http.route"] == "/ready"'
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.node.name
            - k8s.pod.uid
            - k8s.container.name
          labels:
            - key: app.kubernetes.io/name
            - key: app.kubernetes.io/component
            - key: app.kubernetes.io/part-of

      batch:
        send_batch_size: 1024
        timeout: 1s
    connectors:
      span_metrics:
        dimensions:
          - name: http.method
            default: "GET"
          - name: http.status_code
            default: "0"
          - name: http.route
            default: "unknown"
          - name: rpc.system
            default: "unknown"
          - name: rpc.method
            default: "unknown"
          - name: messaging.system
            default: "unknown"
          - name: db.system.name
            default: "unknown"
          - name: k8s.pod.name
            default: "unknown"
    extensions:
      basicauth:
        client_auth:
          username: elastic
          password: ${env:ES_PASSWORD}
    exporters:
      otlp/jaeger:
        endpoint: jaeger-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
      elasticsearch:
        endpoints:
          ["https://elasticsearch-es-http.observability.svc.cluster.local:9200"]
        logs_index: "rrq-logs"
        auth:
          authenticator: basicauth
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: ""
    service:
      extensions: [basicauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/health_checks, k8sattributes, batch]
          exporters: [otlp/jaeger, span_metrics]
        metrics:
          receivers: [otlp, kafka_metrics, span_metrics]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [elasticsearch]
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
