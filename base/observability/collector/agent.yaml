apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: agent
  namespace: observability
spec:
  image: otel/opentelemetry-collector-contrib:0.156.0
  mode: daemonset
  serviceAccount: agent
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/rrq_*/*/*.log # Targets RRQ application container logs only
        start_at: beginning
        operators:
          - type: regex_parser
            regex: "^(?P<time>[^ Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$" # Standard containerd CRI log format
            timestamp:
              parse_from: attributes.time
              layout: "%Y-%m-%dT%H:%M:%S.%LZ"
          - type: json_parser
            parse_from: attributes.log
            if: 'attributes.log matches "^\\{"' # Parse structured JSON application logs
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          network: {}
          load: {}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      filter/telemetry_noise:
        error_mode: ignore
        traces:
          span:
            - 'attributes["url.path"] == "/health"' # Drop noise from k8s liveness/readiness probes
            - 'attributes["url.path"] == "/ready"'
            - 'attributes["url.path"] == "/.well-known/jwks.json"'
            - 'attributes["url.path"] == "/v1/traces"'
            - 'attributes["url.path"] == "/v1/metrics"'
            - 'attributes["http.target"] == "/health"'
            - 'attributes["http.target"] == "/ready"'
            - 'attributes["http.target"] == "/.well-known/jwks.json"'
            - 'attributes["http.target"] == "/v1/traces"'
            - 'attributes["http.target"] == "/v1/metrics"'
            - 'attributes["http.route"] == "/health"'
            - 'attributes["http.route"] == "/ready"'
            - 'attributes["http.route"] == "/.well-known/jwks.json"'
            - 'attributes["server.port"] == 4318'
      batch:
        send_batch_size: 256 # Flushes smaller batches to prevent gRPC streaming timeouts
        timeout: 500ms
    exporters:
      otlp/gateway:
        endpoint: gateway-collector.observability.svc.cluster.local:4317
        timeout: 30s # Prevents deadline exceeded during batch export to gateway
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/telemetry_noise, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
