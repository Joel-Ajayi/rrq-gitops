# Dynamic JWT Verification Security Policy
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: rrq-security-policy
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rrq-protected-route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rrq-admin-route
  jwt:
    providers:
      - name: merchant-auth
        issuer: rrq-core-api
        remoteJWKS:
          uri: http://core-api.rrq.svc.cluster.local:8080/.well-known/jwks.json
        claimToHeaders:
          - claim: sub
            header: X-Merchant-Id
          - claim: tier
            header: X-Merchant-Tier
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rrq-merchant-rate-limit
  namespace: rrq
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rrq-protected-route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rrq-admin-route

  rateLimit:
    global:
      rules:
        # Premium merchants (the platform merchant) get 10x the standard budget.
        - clientSelectors:
            - headers:
                - type: Exact
                  name: X-Merchant-Tier
                  value: premium
                - type: Distinct
                  name: X-Merchant-Id
          limit:
            requests: 1000
            unit: Minute
        # Standard merchants.
        - clientSelectors:
            - headers:
                - type: Exact
                  name: X-Merchant-Tier
                  value: standard
                - type: Distinct
                  name: X-Merchant-Id
          limit:
            requests: 100
            unit: Minute
        # Catch-all: requests with a missing/unknown tier header are still
        # rate limited per merchant at the standard budget.
        - clientSelectors:
            - headers:
                - type: Distinct
                  name: X-Merchant-Id
          limit:
            requests: 100
            unit: Minute
