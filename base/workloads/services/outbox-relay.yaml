apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: rrq
  labels:
    app.kubernetes.io/name: outbox-relay
    app.kubernetes.io/part-of: rrq
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-relay
        app.kubernetes.io/part-of: rrq
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z merchants-db-rw.rrq 5432 2>/dev/null; do
                echo "Waiting for merchants-db Postgres..."
                sleep 2
              done
              until nc -z shard-a-rw.rrq 5432 2>/dev/null; do
                echo "Waiting for shard-a Postgres..."
                sleep 2
              done
              until nc -z shard-b-rw.rrq 5432 2>/dev/null; do
                echo "Waiting for shard-b Postgres..."
                sleep 2
              done
              until nc -z rrq-kafka-bootstrap.rrq 9092 2>/dev/null; do
                echo "Waiting for Kafka..."
                sleep 2
              done
      containers:
        - name: outbox-relay
          image: rrq/outbox-relay
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: platform-config
            - configMapRef:
                name: outbox-relay-config
          env:
            - name: MERCHANTS_DB_URI
              valueFrom:
                secretKeyRef:
                  name: merchants-db-app
                  key: uri
            - name: SHARD_A_URI
              valueFrom:
                secretKeyRef:
                  name: shard-a-app
                  key: uri
            - name: SHARD_B_URI
              valueFrom:
                secretKeyRef:
                  name: shard-b-app
                  key: uri
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap.rrq.svc.cluster.local:9092"
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          livenessProbe:
            exec:
              command:
                - pgrep
                - service
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - pgrep
                - service
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 267m
              memory: 74Mi
            limits:
              cpu: 267m
              memory: 74Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - outbox-relay
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-relay
  namespace: rrq
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-relay
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: outbox-relay
  namespace: rrq
spec:
  scaleTargetRef:
    name: outbox-relay
  minReplicaCount: 3
  maxReplicaCount: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.observability.svc.cluster.local:9090
        metricName: rrq_outbox_lag_seconds
        query: "sum(rrq_outbox_lag_seconds) by (shard)"
        threshold: "5"
        activateThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.observability.svc.cluster.local:9090
        metricName: rrq_circuit_breaker_state
        query: 'sum(rrq_circuit_breaker_state{circuit_breaker="kafka-egress"} == 2)'
        threshold: "1"
        activateThreshold: "0"
