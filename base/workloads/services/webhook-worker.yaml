apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-worker
  namespace: rrq
  labels:
    app.kubernetes.io/name: webhook-worker
    app.kubernetes.io/part-of: rrq
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-worker
        app.kubernetes.io/part-of: rrq
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z shard-a-rw.rrq 5432 2>/dev/null; do
                echo "Waiting for shard-a Postgres..."
                sleep 2
              done
              until nc -z shard-b-rw.rrq 5432 2>/dev/null; do
                echo "Waiting for shard-b Postgres..."
                sleep 2
              done
              until nc -z kafka-cluster-kafka-bootstrap.rrq 9092 2>/dev/null; do
                echo "Waiting for Kafka..."
                sleep 2
              done
      containers:
        - name: webhook-worker
          image: rrq/webhook-worker
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: platform-config
            - configMapRef:
                name: webhook-worker-config
          env:
            - name: MERCHANTS_DB_URI
              valueFrom:
                secretKeyRef:
                  name: merchants-db-app
                  key: uri
            - name: SHARD_A_URI
              valueFrom:
                secretKeyRef:
                  name: shard-a-app
                  key: uri
            - name: SHARD_B_URI
              valueFrom:
                secretKeyRef:
                  name: shard-b-app
                  key: uri
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap.rrq.svc.cluster.local:9092"
            - name: OTEL_SERVICE_NAME
              value: "webhook-worker"
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          livenessProbe:
            exec:
              command:
                - pgrep
                - service
            initialDelaySeconds: 30
            periodSeconds: 30

          resources:
            requests:
              cpu: 400m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - webhook-worker
                topologyKey: kubernetes.io/hostname
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: webhook-worker
  namespace: rrq
spec:
  scaleTargetRef:
    name: webhook-worker
  minReplicaCount: 3
  maxReplicaCount: 5
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: rrq-kafka-bootstrap.rrq.svc.cluster.local:9092
        consumerGroup: webhook-worker
        topic: notify
        lagThreshold: "56800"
        offsetResetPolicy: earliest
    - type: postgresql
      metadata:
        connectionFromEnv: SHARD_A_URI
        query: "SELECT COUNT(*) FROM webhook_deliveries WHERE status = 'pending' AND next_retry_at <= NOW()"
        targetQueryValue: "100"
    - type: postgresql
      metadata:
        connectionFromEnv: SHARD_B_URI
        query: "SELECT COUNT(*) FROM webhook_deliveries WHERE status = 'pending' AND next_retry_at <= NOW()"
        targetQueryValue: "100"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhook-worker
  namespace: rrq
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-worker
