apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-echo
  namespace: rrq
  labels:
    app.kubernetes.io/name: webhook-echo
    app.kubernetes.io/part-of: rrq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-echo
        app.kubernetes.io/part-of: rrq
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: webhook-echo
          image: rrq/webhook-echo
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          envFrom:
            - configMapRef:
                name: rrq-platform-config
          env:
            - name: HTTP_PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-echo
  namespace: rrq
  labels:
    app.kubernetes.io/name: webhook-echo
    app.kubernetes.io/part-of: rrq
spec:
  selector:
    app.kubernetes.io/name: webhook-echo
  ports:
    - name: http
      port: 8080
      targetPort: http
