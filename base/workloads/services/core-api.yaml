apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: rrq
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: rrq
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        app.kubernetes.io/part-of: rrq
    spec:
      terminationGracePeriodSeconds: 35
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z merchants-db-rw.rrq 5432 2>/dev/null; do
                echo "Waiting for merchants-db Postgres..."
                sleep 2
              done
              until nc -z shard-a-rw.rrq 5432 2>/dev/null; do
                echo "Waiting for shard-a Postgres..."
                sleep 2
              done
              until nc -z shard-b-rw.rrq 5432 2>/dev/null; do
                echo "Waiting for shard-b Postgres..."
                sleep 2
              done
      containers:
        - name: core-api
          image: rrq/core-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          envFrom:
            - configMapRef:
                name: platform-config
            - configMapRef:
                name: core-api-config
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: MERCHANTS_DB_URI
              valueFrom:
                secretKeyRef:
                  name: merchants-db-app
                  key: uri
            - name: SHARD_A_URI
              valueFrom:
                secretKeyRef:
                  name: shard-a-app
                  key: uri
            - name: SHARD_B_URI
              valueFrom:
                secretKeyRef:
                  name: shard-b-app
                  key: uri
            - name: JWT_ACTIVE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rrq-secrets
                  key: jwt-active-key-id
            - name: JWT_SIGNING_KEYS
              valueFrom:
                secretKeyRef:
                  name: rrq-secrets
                  key: jwt-signing-keys
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap.rrq.svc.cluster.local:9092"
            - name: OTEL_SERVICE_NAME
              value: "core-api"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 1800m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - core-api
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: rrq
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: rrq
spec:
  selector:
    app.kubernetes.io/name: core-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# controls scaling based on LOAD
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-api
  namespace: rrq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-api
  minReplicas: 4
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# controls availability during DISRUPTIONS (e.g. node maintenance)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-api
  namespace: rrq
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
