# Dynamic JWT Verification Security Policy
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: rrq-security-policy
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rrq-protected-route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rrq-admin-route
  jwt:
    providers:
      - name: merchant-auth
        issuer: core-api
        remoteJWKS:
          uri: http://core-api.rrq.svc.cluster.local:8080/.well-known/jwks.json
        claimToHeaders:
          - claim: sub
            header: X-Merchant-Id
          - claim: tier
            header: X-Merchant-Tier
