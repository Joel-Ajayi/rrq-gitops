# Unprotected edge routes (no auth)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rrq-public-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "api.127.0.0.1.nip.io"
    - "api.rrq.yotstack.tech"
  rules:
    - matches:
        - path:
            type: Exact
            value: /health
        - path:
            type: Exact
            value: /ready
        - path:
            type: Exact
            value: /.well-known/jwks.json
        - path:
            type: Exact
            value: /v1/auth/token
        - path:
            type: Exact
            value: /v1/merchants
      backendRefs:
        - name: core-api
          port: 8080
---
# Protected edge route for all /v1/* resources (JWT-verified via SecurityPolicy)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rrq-protected-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "api.127.0.0.1.nip.io"
    - "api.rrq.yotstack.tech"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/wallets
        - path:
            type: PathPrefix
            value: /v1/transfers
        - path:
            type: PathPrefix
            value: /v1/balances
        - path:
            type: PathPrefix
            value: /v1/jobs
        - path:
            type: PathPrefix
            value: /v1/ledger
        - path:
            type: PathPrefix
            value: /v1/accounts
      backendRefs:
        - name: core-api
          port: 8080
---
# Admin-only route: more specific than /v1, stamped by the gateway with
# X-RRQ-Edge: envoy so core-api's requirePlatformAdmin middleware can reject
# requests that bypass the edge (e.g. direct pod-to-pod access).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rrq-admin-route
  namespace: rrq
  labels:
    app.kubernetes.io/part-of: rrq
spec:
  parentRefs:
    - name: rrq-gateway
  hostnames:
    - "api.127.0.0.1.nip.io"
    - "api.rrq.yotstack.tech"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/admin
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-RRQ-Edge
                value: envoy
      backendRefs:
        - name: core-api
          port: 8080
