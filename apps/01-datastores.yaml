apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datastores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Joel-Ajayi/rrq-gitops.git
    targetRevision: HEAD
    path: overlays/prod/datastores
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
