apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rrq-prod-apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: sealed-secrets
            wave: "-3"
            path: sealed-secrets
          - name: operators
            wave: "-2"
            path: operators
          - name: gateway
            wave: "-1"
            path: gateway
          - name: datastores
            wave: "0"
            path: datastores
          - name: observability
            wave: "1"
            path: observability
          - name: workloads
            wave: "2"
            path: workloads
  template:
    metadata:
      name: "{{name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/Joel-Ajayi/rrq-gitops.git
        targetRevision: HEAD
        path: "overlays/prod/{{path}}"
        kustomize:
          buildOptions: "--enable-helm"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - Force=true
