apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rrq-local-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Joel-Ajayi/rrq-gitops.git
    targetRevision: HEAD
    path: apps-local
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Force=true
