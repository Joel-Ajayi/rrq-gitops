# RRQ Capacity Engine Input
# Every value is either measured (Prometheus/k6) or a business requirement.
# No defaults, no fallbacks — the YAML is the sole source of truth.

infrastructure:
  postgres:
    instances:
      merchants:
        cores: 4 # k8s node provisioned vCPU count (Terraform)
        ram_bytes: 34359738368 # k8s node provisioned RAM (Terraform)
        effective_spindles: 1 # AWS EBS gp3 volume count
        parallel_io_limit: 0 # pg_settings max_worker_processes limit
        work_mem_mb: 16 # DBA tuning - per-query sort memory allocation
      shard-a:
        cores: 4 # k8s node provisioned vCPU count (Terraform)
        ram_bytes: 34359738368 # k8s node provisioned RAM (Terraform)
        effective_spindles: 1 # AWS EBS gp3 volume count
        parallel_io_limit: 0 # pg_settings max_worker_processes limit
        work_mem_mb: 16 # DBA tuning - per-query sort memory allocation
      shard-b:
        cores: 4 # k8s node provisioned vCPU count (Terraform)
        ram_bytes: 34359738368 # k8s node provisioned RAM (Terraform)
        effective_spindles: 1 # AWS EBS gp3 volume count
        parallel_io_limit: 0 # pg_settings max_worker_processes limit
        work_mem_mb: 16 # DBA tuning - per-query sort memory allocation
    workload:
      session_busy_ratio: 0.3 # postgres-exporter `pg_stat_activity` active vs idle ratio (requires pg_exporter scrape)
      avg_parallelism: 1 # postgres-exporter pg_settings max_parallel_workers_per_gather usage (requires pg_exporter)
    tuning:
      shared_buffers_pct: 0.25 # Postgres Tuning Guide - 25% RAM allocated to shared_buffers
      os_buffer_pct: 0.25 # OS tuning - memory left for page cache
      maintenance_pct: 0.15 # Postgres Tuning Guide - memory reserved for VACUUM/ANALYZE
    connection:
      max_idle_ms: 600000 # Go pgxpool standard / LB idle timeout threshold (10 min)
      max_lifetime_ms: 1800000 # Firewall / TCP max connection age policy (30 min)

  kafka:
    brokers: 2 # Terraform aws_msk_cluster broker count
    per_broker_partition_cap: 1000 # AWS MSK m5.large recommended max partitions
    replication_factor: 2 # Business Data Durability Policy
    retention_days: 3 # Business Data Retention Policy / GDPR
    segment_seconds: 86400 # Kafka topic 'segment.ms' (must be <= retention)
    broker_fd_ulimit: 65536 # OS level 'ulimit -n' on Kafka brokers
    latency_critical: false # Product Policy - defines if we optimize for throughput vs latency
    partition_consume_rps:
      jobs: 800 # k6 soak test - max RPS single consumer can pull before lag accumulates
      xshard.shard-a: 400 # k6 soak test - max RPS single consumer can pull before lag accumulates
      xshard.shard-b: 400 # k6 soak test - max RPS single consumer can pull before lag accumulates
      notify: 200 # k6 soak test - max RPS single consumer can pull before lag accumulates
    reader_min_bytes: 1 # Kafka client 'fetch.min.bytes' tuning
    reader_max_bytes: 1240000 # Kafka client 'max.partition.fetch.bytes' tuning (~1.2MB)
    reader_max_wait_ms: 500 # Kafka client 'fetch.max.wait.ms' long-polling delay
    writer_max_attempts: 5 # Kafka producer client retry limit

  redis:
    nodes: 1 # Terraform aws_elasticache_cluster node count
    ram_bytes_per_node: 8589934592 # Terraform instance type RAM (8 GiB)
    fork_headroom: 0.30 # Redis docs - 30% safety margin for BGSAVE memory spikes
    fragmentation_factor: 1.25 # redis-exporter `redis_memory_fragmentation_ratio` historical average target (requires redis-exporter scrape)
    per_key_bytes: 160 # Redis 'MEMORY USAGE' command sampling
    ketama_vnodes: 160 # Client consistent hashing virtual nodes standard

  pod:
    cpu_limit_millicores: 1000 # k8s Deployment hardware resource limits
    mem_limit_bytes: 268435456 # k8s Deployment hardware resource limits (256 MiB)

defaults:
  slack_percent: 0.15 # Capacity Team - 15% SLO budget buffer for GC/network overhead
  az_redundancy_factor: 1.5 # Capacity Team - N+1 scaling for 3 Availability Zones (1.5x multiplier)
  growth_headroom: 1.5 # Capacity Team - Future traffic growth buffer (50% headroom)
  retry_budget_fraction: 0.10 # Capacity Team - Max allowable throughput penalty for retries (10%)
  worker_amplification: 1.30 # Capacity Team - Max queueing buildup multiplier under saturation
  http_headroom: 1.50 # Capacity Team - Downstream HTTP connection burst multiplier
  pool_floor: 3 # Capacity Team - Absolute minimum worker/connection pool size

  consumer_session_buffer_ms: 5000 # Capacity Team - Network jitter buffer over ProcessTimeout
  consumer_commit_flush_ms: 1000 # Kafka client 'auto.commit.interval.ms' tuning
  consumer_partition_size: 100 # Go channel buffer capacity per partition
  consumer_max_pending_mb: 64 # Go memory limit per consumer group (OOM protection)
  consumer_min_commit_cap_frac: 0.3 # Minimum batch commit threshold fraction

  dlq_max_retries: 2 # Product Policy - Max synchronous retry attempts before dead-lettering
  relay_max_fetch_batch: 1000 # DB protection - hard limit on PG outbox poll batch size

services:
  # === core-api: synchronous HTTP API gateway ===
  - name: core-api
    slo:
      target: 0.9995 # Product SLO - 99.95% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 2000 # Product SLO - p99 Synchronous Request Latency Deadline
      target_utilization: 0.65 # Capacity Team - Maximum allowed sustained CPU/Pool utilization
    role: api # Architecture definition - synchronous HTTP ingress
    rps_per_core: 1250 # k6 stress test - max RPS before pod CPU hits 100%
    cores_per_pod: 2 # k8s pod CPU allocation profile
    hpa_target_cpu: 0.70 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 268435456 # k8s pod Memory limit (256 MiB)
    jwt_access_hrs: 24 # Security Team - JWT Token expiration policy
    argon2_memory_kib: 65536 # Security Team - OWASP Argon2id recommended memory cost
    argon2_iterations: 3 # Security Team - OWASP Argon2id recommended CPU iterations
    argon2_parallelism: 0 # Security Team - Argon2id concurrency setting
    max_request_bytes: 524288 # Security Team - WAF payload size limit (512KB)
    endpoints:
      - name: create-transfer
        nominal_qps: 3000 # span_metrics calls `traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}` p50 over 7 days
        peak_qps: 5000 # span_metrics calls `traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}` p99 over 7 days
        avg_query_time_ms: 3 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.5 # span_metrics duration variance/mean² (Highly variable)
        c_a_squared: 1.0 # Assuming pure Poisson arrival distribution
        db_instance: shard-a # Architecture definition - Target DB cluster
        writes_per_message: 1 # trace analysis - DB write span count per request (requires pgx DB span instrumentation)
      - name: get-balance
        nominal_qps: 500 # span_metrics calls `traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}` p50 over 7 days
        peak_qps: 1000 # span_metrics calls `traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}` p99 over 7 days
        avg_query_time_ms: 5 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.5 # span_metrics duration variance/mean² (Highly variable)
        c_a_squared: 1.0 # Assuming pure Poisson arrival distribution
        db_instance: shard-a # Architecture definition - Target DB cluster
        writes_per_message: 0 # trace analysis - DB write span count per request (requires pgx DB span instrumentation)
      - name: merchant-lookup
        nominal_qps: 3500 # span_metrics calls `traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}` p50 over 7 days
        peak_qps: 6000 # span_metrics calls `traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}` p99 over 7 days
        avg_query_time_ms: 2 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.0 # span_metrics duration variance/mean²
        c_a_squared: 1.0 # Assuming pure Poisson arrival distribution
        db_instance: merchants # Architecture definition - Target DB cluster
        writes_per_message: 0 # trace analysis - DB write span count per request (requires pgx DB span instrumentation)
    circuit_breaker:
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate
      min_requests: 90 # k6 chaos test - statistical significance threshold
      interval_ms: 10000 # k6 chaos test - rapid failure detection window
      max_fails: 3 # k6 chaos test - hard failure fast-trip limit
      half_open_probes: 1 # k6 chaos test - half-open probe concurrency

  # === outbox-relay: polls PG events, produces to Kafka ===
  - name: outbox-relay
    slo:
      target: 0.999 # Product SLO - 99.9% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 2000 # Product SLO - End-to-end publish latency SLA
      target_utilization: 0.65 # Capacity Team - Maximum allowed sustained CPU utilization
    role: producer # Architecture definition - async Kafka producer
    rps_per_core: 1000 # k6 stress test - max DB-to-Kafka RPS before CPU saturation
    cores_per_pod: 1 # k8s pod CPU allocation profile
    hpa_target_cpu: 1 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 268435456 # k8s pod Memory limit
    producer_throughput_rps: 4000 # k6 stress test - max Kafka produce RPS before OS socket exhaustion
    endpoints:
      - name: poll-shard-a
        nominal_qps: 200 # postgres-exporter `pg_stat_statements` outbox read RPS p50 (requires pg_exporter scrape)
        peak_qps: 400 # postgres-exporter `pg_stat_statements` outbox read RPS p99 (requires pg_exporter scrape)
        avg_query_time_ms: 5 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.5 # span_metrics duration variance/mean²
        c_a_squared: 0.3 # Batched arrival distribution (highly uniform)
        db_instance: shard-a # Architecture definition - Target DB cluster
        writes_per_message: 2 # trace analysis - outbox marker update count per relay poll
      - name: poll-shard-b
        nominal_qps: 200 # postgres-exporter `pg_stat_statements` outbox read RPS p50 (requires pg_exporter scrape)
        peak_qps: 400 # postgres-exporter `pg_stat_statements` outbox read RPS p99 (requires pg_exporter scrape)
        avg_query_time_ms: 5 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.5 # span_metrics duration variance/mean²
        c_a_squared: 0.3 # Batched arrival distribution (highly uniform)
        db_instance: shard-b # Architecture definition - Target DB cluster
        writes_per_message: 2 # trace analysis - outbox marker update count per relay poll
    topics:
      - jobs # Architecture definition - Producer topic routing
      - notify # Architecture definition - Producer topic routing
      - xshard.shard-a # Architecture definition - Producer topic routing
      - xshard.shard-b # Architecture definition - Producer topic routing
    circuit_breaker:
      max_fails: 3 # k6 chaos test - hard failure fast-trip limit
      half_open_probes: 1 # k6 chaos test - half-open probe concurrency
      interval_ms: 10000 # k6 chaos test - rapid failure detection window
      min_requests: 90 # k6 chaos test - statistical significance threshold
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate
    relay:
      staging_kb: 50 # trace/OTel - average outbox payload size
      max_payload_kb: 64 # Kafka producer 'max.request.size' configuration limit
      buffer_sample_interval_ms: 100 # Capacity Team - AIMD buffer sample frequency
      buffer_max_throttle_level: 3 # k6 backpressure test - AIMD max backoff depth
      buffer_max_poll_interval_ms: 48 # SHOULD BE DERIVED: Redundant with relayDerived math
      aimd_throttle_frac: 0.8 # k6 backpressure test - AIMD throttle aggressiveness
      aimd_pause_frac: 1.0 # k6 backpressure test - AIMD pause multiplier
      aimd_resume_frac: 0.5 # k6 backpressure test - AIMD recovery step

  # === ledger-worker: SERIALIZABLE tx, cross-shard saga ===
  - name: ledger-worker
    slo:
      target: 0.999 # Product SLO - 99.9% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 2000 # Product SLO - End-to-end processing SLA
      target_utilization: 0.65 # Capacity Team - Maximum allowed sustained pool utilization
    role: consumer # Architecture definition - async Kafka consumer
    rps_per_core: 500 # k6 stress test - max RPS before pod CPU hits 100%
    cores_per_pod: 1 # k8s pod CPU allocation profile
    hpa_target_cpu: 1 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 268435456 # k8s pod Memory limit
    endpoints:
      - name: process-transfer-shard-a
        nominal_qps: 60 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p50 over 7 days
        peak_qps: 100 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p99 over 7 days
        avg_query_time_ms: 20 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.5 # span_metrics duration variance/mean²
        c_a_squared: 0.5 # Partition batched arrival distribution
        db_instance: shard-a # Architecture definition - Target DB cluster
        writes_per_message: 11 # trace analysis - saga transaction DB write count
      - name: process-transfer-shard-b
        nominal_qps: 60 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p50 over 7 days
        peak_qps: 100 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p99 over 7 days
        avg_query_time_ms: 20 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.5 # span_metrics duration variance/mean²
        c_a_squared: 0.5 # Partition batched arrival distribution
        db_instance: shard-b # Architecture definition - Target DB cluster
        writes_per_message: 11 # trace analysis - saga transaction DB write count
    topics:
      - jobs # Architecture definition - Consumer topic subscriptions
      - xshard.shard-a # Architecture definition - Consumer topic subscriptions
      - xshard.shard-b # Architecture definition - Consumer topic subscriptions
    circuit_breaker:
      max_fails: 3 # k6 chaos test - hard failure fast-trip limit
      half_open_probes: 1 # k6 chaos test - half-open probe concurrency
      interval_ms: 10000 # k6 chaos test - rapid failure detection window
      min_requests: 90 # k6 chaos test - statistical significance threshold
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate

  # === webhook-worker: Kafka consumer + HTTPS delivery ===
  - name: webhook-worker
    slo:
      target: 0.999 # Product SLO - 99.9% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 30000 # Product SLO - Max delivery SLA (30s timeout allowance)
      target_utilization: 0.65 # Capacity Team - Maximum allowed sustained pool utilization
    role: consumer # Architecture definition - async Kafka consumer
    rps_per_core: 800 # k6 stress test - max RPS before pod CPU hits 100%
    cores_per_pod: 1 # k8s pod CPU allocation profile
    hpa_target_cpu: 1 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 268435456 # k8s pod Memory limit
    endpoints:
      - name: delivery-tracking-shard-a
        nominal_qps: 60 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p50 over 7 days
        peak_qps: 100 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p99 over 7 days
        avg_query_time_ms: 45 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.5 # span_metrics duration variance/mean²
        c_a_squared: 0.5 # Partition batched arrival distribution
        db_instance: shard-a # Architecture definition - Target DB cluster
        writes_per_message: 3 # trace analysis - DB state update count per webhook execution
      - name: delivery-tracking-shard-b
        nominal_qps: 60 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p50 over 7 days
        peak_qps: 100 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p99 over 7 days
        avg_query_time_ms: 45 # span_metrics `traces_span_metrics_duration_seconds` mean over DB spans (requires pgx DB span instrumentation)
        c_s_squared: 1.5 # span_metrics duration variance/mean²
        c_a_squared: 0.5 # Partition batched arrival distribution
        db_instance: shard-b # Architecture definition - Target DB cluster
        writes_per_message: 3 # trace analysis - DB state update count per webhook execution
    topics:
      - notify # Architecture definition - Consumer topic subscriptions
    http_outbound:
      peak_qps_per_pod: 100 # k6 stress test - max outgoing HTTP connections per pod before port exhaustion
      avg_latency_s: 1.0 # span_metrics `traces_span_metrics_duration_seconds{span_kind="SPAN_KIND_CLIENT",service_name="webhook-worker"}` outbound p50
      host_count: 3 # Capacity Team - Estimated concurrent distinct merchant domains
      per_host_headroom: 16 # Go net/http DefaultMaxIdleConnsPerHost baseline + safety
      idle_conn_timeout_ms: 90000 # Go net/http DefaultIdleConnTimeout (90s)
      response_header_timeout_ms: 10000 # Product Policy - merchant must reply headers in 10s
      tls_handshake_timeout_ms: 5000 # Network Standard - max TLS negotiation time
      expect_continue_timeout_ms: 1000 # Go net/http standard expectation timeout
    circuit_breaker:
      max_fails: 3 # k6 chaos test - hard failure fast-trip limit
      half_open_probes: 1 # k6 chaos test - half-open probe concurrency
      interval_ms: 10000 # k6 chaos test - rapid failure detection window
      min_requests: 90 # k6 chaos test - statistical significance threshold
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate
    webhook:
      delivery_max_attempts: 15 # Product Policy - Merchant webhook delivery absolute retry limit
      delivery_backoff_base_ms: 1000 # Product Policy - Initial exponential backoff delay
      delivery_backoff_cap_ms: 60000 # Product Policy - Max backoff interval (1 minute)
      scheduler_poll_interval_ms: 5000 # Capacity Team - DB polling interval for delayed retries
      scheduler_batch_size: 100 # k6 DB scan test - max batch before lock contention
      fast_lane_grace_period_ms: 5000 # Capacity Team - Thread handoff buffer for synchronous delivery
      fast_lane_buffer_size: 100 # k6 load test - optimal fast-lane buffer depth
      breaker_eviction_interval_ms: 60000 # k6 soak test - safe eviction interval without flap

  # === fraud-worker: consumer + Redis sliding-window velocity ===
  - name: fraud-worker
    slo:
      target: 0.999 # Product SLO - 99.9% Availability Target
      window_hours: 720 # Product SLO - Monthly reporting window
      latency_ms: 5000 # Product SLO - End-to-end processing SLA
      target_utilization: 0.65 # Capacity Team - Maximum allowed sustained pool utilization
    role: consumer # Architecture definition - async Kafka consumer
    rps_per_core: 2000 # k6 stress test - max RPS before pod CPU hits 100%
    cores_per_pod: 1 # k8s pod CPU allocation profile
    hpa_target_cpu: 1 # k8s HPA autoscale trigger threshold
    mem_limit_bytes: 268435456 # k8s pod Memory limit
    velocity_threshold: 5 # Risk/Trust Team - Max transfers allowed per window
    velocity_window_ms: 60000 # Risk/Trust Team - Transfer velocity window (1 minute)
    endpoints:
      - name: velocity-check-shard-a
        nominal_qps: 60 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p50 over 7 days
        peak_qps: 100 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p99 over 7 days
        avg_query_time_ms: 0.5 # span_metrics `traces_span_metrics_duration_seconds` mean over Redis/DB spans
        c_s_squared: 1.0 # span_metrics duration variance/mean²
        c_a_squared: 0.5 # Partition batched arrival distribution
        db_instance: shard-a # Architecture definition - Target DB cluster
        writes_per_message: 2 # trace analysis - DB state update count per message
      - name: velocity-check-shard-b
        nominal_qps: 60 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p50 over 7 days
        peak_qps: 100 # kafka_metrics consume RPS from `kafka_consumer_offset` deltas p99 over 7 days
        avg_query_time_ms: 0.5 # span_metrics `traces_span_metrics_duration_seconds` mean over Redis/DB spans
        c_s_squared: 1.0 # span_metrics duration variance/mean²
        c_a_squared: 0.5 # Partition batched arrival distribution
        db_instance: shard-b # Architecture definition - Target DB cluster
        writes_per_message: 2 # trace analysis - DB state update count per message
    topics:
      - jobs # Architecture definition - Consumer topic subscriptions
    redis:
      merchants: 500000 # Data Analytics - Number of total active merchants to track
      window_buckets: 2 # Risk/Trust Team - Sub-buckets for sliding window precision
    circuit_breaker:
      max_fails: 3 # k6 chaos test - hard failure fast-trip limit
      half_open_probes: 1 # k6 chaos test - half-open probe concurrency
      interval_ms: 10000 # k6 chaos test - rapid failure detection window
      min_requests: 90 # k6 chaos test - statistical significance threshold
      error_threshold: 0.00005 # Circuit Breaker tuning - trip at 0.005% error rate
