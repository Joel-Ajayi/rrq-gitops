# Local Production Kind cluster (1 control-plane + 3 workers).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rrq
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1
    # Envoy Gateway is exposed on host :8080 (HTTP) and :8443 (HTTPS) via NodePort 30080 / 30443.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  # 3 dedicated worker nodes so 2-replica services and anti-affinity topologies are real.
  - role: worker
  - role: worker
  - role: worker
